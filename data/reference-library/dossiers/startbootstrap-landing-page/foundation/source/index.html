<!DOCTYPE html>
<html lang="en"><head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta name="description" content="">
        <meta name="author" content="">
        <title>{{page.title}}</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
        <!-- Bootstrap icons-->
        <link href="styles/01.css" rel="stylesheet" type="text/css">
        <!-- Google fonts-->
        <link href="styles/02.css" rel="stylesheet" type="text/css">
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="styles/03.css" rel="stylesheet">
    <style>.xp-foundation .d-none {
    display: none;
}
.xp-foundation .invalid-feedback {
    display: none;
}
.xp-foundation .btn.disabled {
    pointer-events: none;
    opacity: 0.65;
}</style></head>
    <body>
        <!-- Navigation-->
        <nav data-foundation-section="navigation" class="navbar navbar-light bg-light static-top">
            <div class="container">
                <a data-foundation-slot="navigation.brand" class="navbar-brand" href="#!">{{navigation.brand}}</a>
                <nav class="container" aria-label="Main navigation"><nav class="container" aria-label="Main navigation"><a class="btn btn-primary" href="#services">Services</a><a class="btn btn-primary" href="#faqs">FAQs</a><a class="btn btn-primary" href="#contact">Contact</a></nav></nav>
            </div>
        </nav><main data-foundation-main="true">
        <!-- Masthead-->
        <header data-experience-hero="true" data-foundation-section="hero" class="masthead">
            <div class="container position-relative">
                <div class="row justify-content-center">
                    <div class="col-xl-6">
                        <div class="text-center text-white">
                            <!-- Page heading-->
                            <h1 data-foundation-slot="hero.heading" class="mb-5">{{hero.heading}}</h1>
                            <!-- Signup form-->
                            <!-- * * * * * * * * * * * * * * *-->
                            <!-- * * SB Forms Contact Form * *-->
                            <!-- * * * * * * * * * * * * * * *-->
                            <!-- This form is pre-integrated with SB Forms.-->
                            <!-- To make this form functional, sign up at-->
                            <!-- https://startbootstrap.com/solution/contact-forms-->
                            <!-- to get an API token!-->
                            
                        </div>
                    </div>
                </div>
            </div>
        </header><aside data-foundation-section="conversion" data-early-conversion="true" class="xp-ribbon"><div class="xp-ribbon__copy">
  <span class="xp-ribbon__kicker">Next step</span>
  <p>{{conversion.body}}</p>
</div>
<a class="xp-ribbon__action" href="#contact">{{conversion.action}} <span aria-hidden="true">→</span></a></aside>
        <!-- Icons Grid-->
        <section data-foundation-needs-adaptation="true" data-foundation-section="unknown" class="features-icons bg-light text-center">
            <div class="container">
                <div class="row">
                    <div class="col-lg-4">
                        <div class="features-icons-item mx-auto mb-5 mb-lg-0 mb-lg-3">
                            <div class="features-icons-icon d-flex"><i class="bi-window m-auto text-primary"></i></div>
                            <h3 data-foundation-slot="unknown.heading">{{unknown.heading}}</h3>
                            <p data-foundation-slot="unknown.body" class="lead mb-0">{{unknown.body}}</p>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="features-icons-item mx-auto mb-5 mb-lg-0 mb-lg-3">
                            <div class="features-icons-icon d-flex"><i class="bi-layers m-auto text-primary"></i></div>
                            <h3></h3>
                            <p class="lead mb-0"></p>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="features-icons-item mx-auto mb-0 mb-lg-3">
                            <div class="features-icons-icon d-flex"><i class="bi-terminal m-auto text-primary"></i></div>
                            <h3></h3>
                            <p class="lead mb-0"></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- Image Showcases-->
        <section data-foundation-section="unknown-2" class="showcase">
            <div class="container-fluid p-0">
                <div class="row g-0">
                    <div class="col-lg-6 order-lg-2 text-white showcase-img" style="background-image: none"></div>
                    <div class="col-lg-6 order-lg-1 my-auto showcase-text">
                        <h2 data-foundation-slot="unknown-2.heading">{{unknown-2.heading}}</h2>
                        <p data-foundation-slot="unknown-2.body" class="lead mb-0">{{unknown-2.body}}</p>
                    </div>
                </div>
                <div class="row g-0">
                    <div class="col-lg-6 text-white showcase-img" style="background-image: none"></div>
                    <div class="col-lg-6 my-auto showcase-text">
                        <h2></h2>
                        <p class="lead mb-0"></p>
                    </div>
                </div>
                <div class="row g-0">
                    <div class="col-lg-6 order-lg-2 text-white showcase-img" style="background-image: none"></div>
                    <div class="col-lg-6 order-lg-1 my-auto showcase-text">
                        <h2></h2>
                        <p class="lead mb-0"></p>
                    </div>
                </div>
            </div>
        </section>
        <!-- Testimonials-->
        <section data-foundation-section="proof" class="testimonials text-center bg-light">
            <div class="container">
                <h2 data-foundation-slot="proof.heading" class="mb-5">{{proof.heading}}</h2>
                <div class="row">
                    <div class="col-lg-4">
                        <div class="testimonial-item mx-auto mb-5 mb-lg-0">
                            <img data-foundation-image="proof.image" class="img-fluid rounded-circle mb-3" src="{{proof.image}}" alt="">
                            <h5></h5>
                            <p data-foundation-slot="proof.body" class="font-weight-light mb-0">{{proof.body}}</p>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="testimonial-item mx-auto mb-5 mb-lg-0">
                            <img data-foundation-image="proof.secondaryImage" class="img-fluid rounded-circle mb-3" src="{{proof.secondaryImage}}" alt="">
                            <h5></h5>
                            <p class="font-weight-light mb-0"></p>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="testimonial-item mx-auto mb-5 mb-lg-0">
                            <img data-foundation-image="proof.tertiaryImage" class="img-fluid rounded-circle mb-3" src="{{proof.tertiaryImage}}" alt="">
                            <h5></h5>
                            <p class="font-weight-light mb-0"></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- Call to Action-->
        <section data-foundation-section="signup" class="call-to-action text-white text-center" id="signup">
            <div class="container position-relative">
                <div class="row justify-content-center">
                    <div class="col-xl-6">
                        <h2 data-foundation-slot="contact.heading" class="mb-4">{{contact.heading}}</h2>
                        <!-- Signup form-->
                        <!-- * * * * * * * * * * * * * * *-->
                        <!-- * * SB Forms Contact Form * *-->
                        <!-- * * * * * * * * * * * * * * *-->
                        <!-- This form is pre-integrated with SB Forms.-->
                        <!-- To make this form functional, sign up at-->
                        <!-- https://startbootstrap.com/solution/contact-forms-->
                        <!-- to get an API token!-->
                        
                    </div>
                </div>
            </div>
        </section>
        <!-- Footer-->
        </main><footer data-foundation-license="MIT" data-foundation-section="footer" class="footer bg-light"><span>{{footer.brand}}</span><span>{{footer.credit}}</span></footer>
        <!-- Bootstrap core JS-->
        
        <!-- Core theme JS-->
        
        <!-- * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *-->
        <!-- * *                               SB Forms JS                               * *-->
        <!-- * * Activate your form at https://startbootstrap.com/solution/contact-forms * *-->
        <!-- * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *-->
        
    

<span data-foundation-anchor="true" id="services"></span><span data-foundation-anchor="true" id="faqs"></span></body></html>
