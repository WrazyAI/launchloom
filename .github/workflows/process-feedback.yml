name: Process developer feedback

on:
  repository_dispatch:
    types: [process-developer-feedback]

permissions:
  contents: write
  pull-requests: write

jobs:
  revise:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: site-revision-${{ github.event.client_payload.repo }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.LAUNCHLOOM_GITHUB_ORG_TOKEN }}
      GITHUB_ORG_TOKEN: ${{ secrets.LAUNCHLOOM_GITHUB_ORG_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      REVIEW_SIGNING_SECRET: ${{ secrets.REVIEW_SIGNING_SECRET }}
      LEAD_SIGNING_SECRET: ${{ secrets.LEAD_SIGNING_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LAUNCHLOOM_FROM_EMAIL: ${{ vars.LAUNCHLOOM_FROM_EMAIL }}
      LAUNCHLOOM_DEVELOPER_EMAIL: ${{ vars.LAUNCHLOOM_DEVELOPER_EMAIL }}
      LAUNCHLOOM_API_URL: https://api.launchloom.wrazyos.com
      ASSET_BASE_URL: https://assets.launchloom.wrazyos.com
      REVISION_COORDINATOR_SECRET: ${{ secrets.REVISION_COORDINATOR_SECRET }}
      GENERATION_TRACKING_SECRET: ${{ secrets.GENERATION_TRACKING_SECRET }}
      REVISION_REQUEST_ID: ${{ github.event.client_payload.requestId }}
      FEEDBACK_COMMENT_ID: ${{ github.event.client_payload.feedbackComment }}
      CLIENT_REPO: ${{ github.event.client_payload.repo }}
      CLIENT_PR: ${{ github.event.client_payload.pr }}
      REVIEWED_PAGE: ${{ github.event.client_payload.reviewedPage }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Claim exact revision request
        id: claim
        env:
          REVISION_QUEUE_ACTION: claim
        run: node scripts/revision-queue-client.mjs
      - name: Install revision verifier
        if: steps.claim.outputs.run == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Clone review branch
        if: steps.claim.outputs.run == 'true'
        id: branch
        run: |
          BRANCH=$(gh pr view "$CLIENT_PR" --repo "$CLIENT_REPO" --json headRefName --jq .headRefName)
          git clone --branch "$BRANCH" "https://x-access-token:${GITHUB_ORG_TOKEN}@github.com/$CLIENT_REPO.git" "$RUNNER_TEMP/client"
          node scripts/revision-checkpoint.mjs \
            --action prepare \
            --repo "$RUNNER_TEMP/client" \
            --request-id "$REVISION_REQUEST_ID" \
            --out "$RUNNER_TEMP/revision-checkpoint.json" \
            --restore-dir "$RUNNER_TEMP"
          REPLAY=$(jq -r '.found // false' "$RUNNER_TEMP/revision-checkpoint.json")
          if [ "$REPLAY" = true ]; then
            BASE_SHA=$(jq -r '.baseSha' "$RUNNER_TEMP/revision-checkpoint.json")
            cp "$RUNNER_TEMP/revision-feedback.txt" "$RUNNER_TEMP/developer-feedback.txt"
          else
            BASE_SHA=$(git -C "$RUNNER_TEMP/client" rev-parse HEAD)
          fi
          printf '%s\n' "$BASE_SHA" > "$RUNNER_TEMP/client-base-sha"
          echo "replay=$REPLAY" >> "$GITHUB_OUTPUT"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "feedback_issue=$(gh pr view "$CLIENT_PR" --repo "$CLIENT_REPO" --json body --jq '.body | capture("launchloom-feedback-inbox:(?<id>[0-9]+)").id')" >> "$GITHUB_OUTPUT"
      - name: Preflight revision write destinations
        if: steps.claim.outputs.run == 'true' && steps.branch.outputs.replay != 'true'
        id: preflight
        run: |
          if ! node scripts/revision-scope.mjs preflight --client "$RUNNER_TEMP/client" --base "$(cat "$RUNNER_TEMP/client-base-sha")" > "$RUNNER_TEMP/revision-preflight.log" 2>&1; then
            cat "$RUNNER_TEMP/revision-preflight.log" >&2
            printf 'Safe-write preflight failed before feedback was applied.\n' > "$RUNNER_TEMP/developer-feedback.txt"
            cat "$RUNNER_TEMP/revision-preflight.log" > "$RUNNER_TEMP/revision-outcome.txt"
            exit 1
          fi
          cat "$RUNNER_TEMP/revision-preflight.log"
      - name: Apply supported revisions
        if: steps.claim.outputs.run == 'true' && steps.branch.outputs.replay != 'true'
        id: apply_feedback
        run: CLIENT_CONFIG_PATH="$RUNNER_TEMP/client/src/site.config.json" FEEDBACK_ISSUE="$CLIENT_PR" FEEDBACK_STAGE=developer FEEDBACK_SUMMARY_PATH="$RUNNER_TEMP/developer-feedback.txt" FEEDBACK_OUTCOME_PATH="$RUNNER_TEMP/revision-outcome.txt" node scripts/apply-feedback.mjs
      - name: Flag feedback that needs manual attention
        if: steps.claim.outputs.run == 'true' && failure() && (steps.preflight.outcome == 'failure' || steps.apply_feedback.outcome == 'failure')
        run: |
          if [ ! -s "$RUNNER_TEMP/developer-feedback.txt" ]; then printf 'The requested feedback could not be safely applied.\n' > "$RUNNER_TEMP/developer-feedback.txt"; fi
          if [ ! -s "$RUNNER_TEMP/revision-outcome.txt" ]; then printf 'The revision workflow stopped before producing a validated outcome.\n' > "$RUNNER_TEMP/revision-outcome.txt"; fi
          DETAILS=$(sed -n '1,80p' "$RUNNER_TEMP/revision-outcome.txt")
          gh pr comment "$CLIENT_PR" --repo "$CLIENT_REPO" --body "$(printf '%s\n\n%s\n\n%s\n\n%s' '<!-- launchloom-manual-attention:developer -->' '## Manual attention needed' 'The requested feedback was not fully fulfilled, so no revised preview or completion email was sent.' "$DETAILS")"
      - name: Configure live site integrations
        if: steps.claim.outputs.run == 'true' && steps.apply_feedback.outcome == 'success'
        env:
          REVISION_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          PROJECT=$(node -e "console.log(require('$RUNNER_TEMP/client/.launchloom-deployment.json').project)")
          PLACE_ID=$(node -e "const x=require('$RUNNER_TEMP/client/src/site.config.json'); console.log(x.socialProof?.source === 'google_reviews' ? x.business.placeId || '' : '')")
          if [ -n "$PLACE_ID" ]; then
            BRANCH_SAFE=$(printf '%s' "$REVISION_BRANCH" | tr '/' '-')
            ORIGINS="https://$BRANCH_SAFE.$PROJECT.pages.dev,https://$PROJECT.pages.dev"
            REVIEWS_TOKEN=$(node scripts/create-google-reviews-token.mjs --project "$PROJECT" --placeId "$PLACE_ID" --origins "$ORIGINS")
            node scripts/enrich-site-config.mjs --file "$RUNNER_TEMP/client/src/site.config.json" --api https://api.launchloom.wrazyos.com --reviewsToken "$REVIEWS_TOKEN"
          fi
          CHAT_ENABLED=$(node -e "const x=require('$RUNNER_TEMP/client/src/site.config.json'); console.log(x.conversion?.aiChat?.enabled ? 'true' : 'false')")
          if [ "$CHAT_ENABLED" = true ]; then
            BRANCH_SAFE=$(printf '%s' "$REVISION_BRANCH" | tr '/' '-')
            ORIGINS="https://$BRANCH_SAFE.$PROJECT.pages.dev,https://$PROJECT.pages.dev"
            CHAT_TOKEN=$(node scripts/create-ai-chat-token.mjs --project "$PROJECT" --file "$RUNNER_TEMP/client/src/site.config.json" --origins "$ORIGINS")
            node scripts/enrich-site-config.mjs --file "$RUNNER_TEMP/client/src/site.config.json" --api https://api.launchloom.wrazyos.com --chatToken "$CHAT_TOKEN"
          fi
      - name: Install client dependencies before creative repair
        if: steps.claim.outputs.run == 'true' && (steps.apply_feedback.outcome == 'success' || steps.branch.outputs.replay == 'true')
        working-directory: ${{ runner.temp }}/client
        run: npm ci
      - name: Refine authored creative candidate from developer feedback
        if: steps.claim.outputs.run == 'true' && steps.apply_feedback.outcome == 'success' && steps.branch.outputs.replay != 'true'
        id: creative_revision
        run: |
          CLIENT_DIR="$RUNNER_TEMP/client"
          node "$GITHUB_WORKSPACE/scripts/sync-revision-template.mjs" --client "$CLIENT_DIR" --guidelines-written "$RUNNER_TEMP/guidelines-written.json"
          RESULT=$(node "$GITHUB_WORKSPACE/scripts/prepare-creative-revision-candidate.mjs" --client "$CLIENT_DIR" --out "$RUNNER_TEMP/creative-revision-candidates")
          echo "$RESULT"
          CREATIVE=$(printf '%s' "$RESULT" | jq -r '.creative // false')
          REQUIRED=$(printf '%s' "$RESULT" | jq -r '.repairRequired // false')
          echo "creative=$CREATIVE" >> "$GITHUB_OUTPUT"
          echo "repair_required=$REQUIRED" >> "$GITHUB_OUTPUT"
          if [ "$CREATIVE" = true ] && [ "$REQUIRED" = true ]; then
            SESSION_ARGS=()
            if [ -f "$CLIENT_DIR/.launchloom/reasoning-preflight.json" ]; then
              SESSION_ARGS=(--session "$CLIENT_DIR/.launchloom/reasoning-preflight.json")
            fi
            node "$GITHUB_WORKSPACE/scripts/run-rendered-creative-repair.mjs" \
              --site-dir "$CLIENT_DIR" \
              --candidates "$RUNNER_TEMP/creative-revision-candidates" \
              --out "$RUNNER_TEMP/human-revision" \
              --mode preview \
              --max-cycles 2 \
              --require-diversity false \
              --feedback-file "$RUNNER_TEMP/developer-feedback.txt" \
              --visual-gate-script "$GITHUB_WORKSPACE/scripts/visual-quality-gate.mjs" \
              "${SESSION_ARGS[@]}"
            SUMMARY="$RUNNER_TEMP/human-revision/summary.json"
            jq -e '.status == "passed" and .visualGatePass == true and .humanRevisionPass == true and (.selectedCandidateId != null)' "$SUMMARY" >/dev/null || { echo "Human creative revision did not pass its acceptance gates"; exit 1; }
            CANDIDATE=$(jq -r '.selectedCandidateId' "$SUMMARY")
            CYCLES=$(jq -r '(.repairCycles // {}) | to_entries | map(.value) | add // 0' "$SUMMARY")
            printf '\nCreative source refinement: candidate %s passed the human request gate after %s repair cycle(s).\n' "$CANDIDATE" "$CYCLES" >> "$RUNNER_TEMP/revision-outcome.txt"
          fi
      - name: Build and direct-upload revised preview
        if: steps.claim.outputs.run == 'true' && (steps.apply_feedback.outcome == 'success' || steps.branch.outputs.replay == 'true')
        id: deploy
        env:
          REVISION_BRANCH: ${{ steps.branch.outputs.name }}
          REPAIR_REQUIRED: ${{ steps.creative_revision.outputs.repair_required }}
          REVISION_REPLAY: ${{ steps.branch.outputs.replay }}
        run: |
          CLIENT_DIR="$RUNNER_TEMP/client"
          cd "$CLIENT_DIR"
          if [ "$REVISION_REPLAY" != true ]; then
            node "$GITHUB_WORKSPACE/scripts/sync-revision-template.mjs" --client "$CLIENT_DIR" --guidelines-written "$RUNNER_TEMP/guidelines-written.json"
            node "$GITHUB_WORKSPACE/scripts/revision-scope.mjs" create --client "$CLIENT_DIR" --base "$(cat "$RUNNER_TEMP/client-base-sha")" --out "$RUNNER_TEMP/revision-scope.json" --guidelines-written "$RUNNER_TEMP/guidelines-written.json" --repair-required "$REPAIR_REQUIRED"
            node "$GITHUB_WORKSPACE/scripts/revision-scope.mjs" validate --client "$CLIENT_DIR" --manifest "$RUNNER_TEMP/revision-scope.json" --stage
            if git diff --cached --quiet; then echo "Feedback produced no reviewable site change." >&2; exit 1; fi
          else
            node "$GITHUB_WORKSPACE/scripts/revision-scope.mjs" validate --client "$CLIENT_DIR" --manifest "$RUNNER_TEMP/revision-scope.json"
          fi
          PROJECT=$(node -e "console.log(require('./.launchloom-deployment.json').project)")
          PUBLIC_REVIEW_MODE=true PUBLIC_LAUNCHLOOM_API_URL=https://api.launchloom.wrazyos.com npm run build
          node "$GITHUB_WORKSPACE/scripts/verify-revision.mjs" --config src/site.config.json --dist dist
          PUBLIC_REVIEW_MODE=true node "$GITHUB_WORKSPACE/scripts/verify-rendered-revision.mjs" --config src/site.config.json --dist dist --screenshots "$RUNNER_TEMP/revision-screenshots"
          node "$GITHUB_WORKSPACE/scripts/seo-release-gate.mjs" --mode review --config src/site.config.json --dist dist --report "$RUNNER_TEMP/route-technical-report.json"
          node "$GITHUB_WORKSPACE/scripts/visual-quality-gate.mjs" --mode plan --config src/site.config.json --screenshots "$RUNNER_TEMP/revision-screenshots" --report "$RUNNER_TEMP/revision-screenshots/visual-gate-plan.json"
          if jq -e '.changed == true' "$RUNNER_TEMP/revision-screenshots/visual-gate-plan.json" >/dev/null; then
            PUBLIC_REVIEW_MODE=true PUBLIC_LAUNCHLOOM_API_URL=https://api.launchloom.wrazyos.com npm run build
            node "$GITHUB_WORKSPACE/scripts/verify-revision.mjs" --config src/site.config.json --dist dist
            PUBLIC_REVIEW_MODE=true node "$GITHUB_WORKSPACE/scripts/verify-rendered-revision.mjs" --config src/site.config.json --dist dist --screenshots "$RUNNER_TEMP/revision-screenshots"
            node "$GITHUB_WORKSPACE/scripts/seo-release-gate.mjs" --mode review --config src/site.config.json --dist dist --report "$RUNNER_TEMP/route-technical-report.json"
            node "$GITHUB_WORKSPACE/scripts/visual-quality-gate.mjs" --mode verify --config src/site.config.json --screenshots "$RUNNER_TEMP/revision-screenshots" --report "$RUNNER_TEMP/revision-screenshots/visual-gate-final.json"
          fi
          # Scan rendered text assets only. Binary generated imagery can contain
          # the UTF-8 byte sequence by coincidence and is not page copy.
          if grep -R -I -F -q --include='*.html' --include='*.css' --include='*.js' --include='*.json' --include='*.svg' --include='*.txt' "—" dist; then echo "Generated page contains an em dash"; exit 1; fi
          if [ "$REVISION_REPLAY" != true ]; then
            node "$GITHUB_WORKSPACE/scripts/revision-scope.mjs" validate --client "$CLIENT_DIR" --manifest "$RUNNER_TEMP/revision-scope.json" --stage
            if git diff --cached --quiet; then echo "Feedback produced no reviewable site change." >&2; exit 1; fi
            SCOPE_B64=$(base64 -w 0 "$RUNNER_TEMP/revision-scope.json")
            git config user.name "LaunchLoom"; git config user.email "automation@launchloom.app"
            git commit -m "Apply developer feedback" \
              -m "LaunchLoom-Revision-Request: $REVISION_REQUEST_ID" \
              -m "LaunchLoom-Revision-Scope: $SCOPE_B64"
            node "$GITHUB_WORKSPACE/scripts/revision-scope.mjs" validate --client "$CLIENT_DIR" --manifest "$RUNNER_TEMP/revision-scope.json"
            git push origin "$REVISION_BRANCH"
          else
            node "$GITHUB_WORKSPACE/scripts/revision-scope.mjs" validate --client "$CLIENT_DIR" --manifest "$RUNNER_TEMP/revision-scope.json"
          fi
          BRANCH_SAFE=$(printf '%s' "$REVISION_BRANCH" | tr '/' '-')
          npx wrangler pages deploy dist --project-name "$PROJECT" --branch "$BRANCH_SAFE" --commit-hash "$(git rev-parse HEAD)" --commit-message "LaunchLoom revision"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "preview=https://$BRANCH_SAFE.$PROJECT.pages.dev" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Post and email revised review link
        id: review_delivery
        if: steps.deploy.outputs.changed == 'true'
        env:
          REVISION_FEEDBACK_ISSUE: ${{ steps.branch.outputs.feedback_issue }}
          DEPLOY_PREVIEW: ${{ steps.deploy.outputs.preview }}
          DEPLOY_PROJECT: ${{ steps.deploy.outputs.project }}
          DEPLOY_SHA: ${{ steps.deploy.outputs.sha }}
        run: |
          node scripts/wait-for-pages-preview.mjs --url "$DEPLOY_PREVIEW"
          CLIENT_EMAIL=$(node -e 'const x=require(process.env.RUNNER_TEMP + "/client/src/site.config.json"); console.log(x.business.email)')
          ORIGINS="$DEPLOY_PREVIEW,https://$DEPLOY_PROJECT.pages.dev"
          TOKEN=$(node scripts/create-review-link.mjs --stage developer --repo "$CLIENT_REPO" --pr "$CLIENT_PR" --sha "$DEPLOY_SHA" --site "$DEPLOY_PROJECT" --email "$LAUNCHLOOM_DEVELOPER_EMAIL" --client-email "$CLIENT_EMAIL" --feedback-issue "$REVISION_FEEDBACK_ISSUE" --origins "$ORIGINS" --token-only true)
          echo "::add-mask::$TOKEN"
          LINK="$DEPLOY_PREVIEW?review=$TOKEN"
          gh pr comment "$CLIENT_PR" --repo "$CLIENT_REPO" --body "$(printf '%s\n\n%s\n\nPreview: %s\n\nSecure developer review: %s' '<!-- launchloom-revision:developer -->' '## Revised developer preview' "$DEPLOY_PREVIEW" "$LINK")"
          ARGS=(--to "$LAUNCHLOOM_DEVELOPER_EMAIL" --name "$(node -e 'const x=require(process.env.RUNNER_TEMP + "/client/src/site.config.json"); console.log(x.business.name)')" --preview "$DEPLOY_PREVIEW" --review "$LINK" --kind revision --audience developer --feedback-file "$RUNNER_TEMP/developer-feedback.txt" --outcome-file "$RUNNER_TEMP/revision-outcome.txt" --idempotency-key "developer-revision-$REVISION_REQUEST_ID")
          node scripts/send-preview-email.mjs "${ARGS[@]}"
      - name: Complete request and start queued revision
        id: complete
        if: steps.claim.outputs.run == 'true' && steps.review_delivery.outcome == 'success'
        env:
          REVISION_QUEUE_ACTION: complete
          QUEUED_FEEDBACK_PATH: ${{ runner.temp }}/queued-feedback.txt
        run: node scripts/revision-queue-client.mjs
      - name: Report downstream developer revision failure
        if: always() && steps.claim.outputs.run == 'true' && (steps.apply_feedback.outcome == 'success' || steps.branch.outputs.replay == 'true') && (steps.deploy.outcome != 'success' || steps.review_delivery.outcome != 'success' || steps.complete.outcome != 'success')
        run: |
          printf '\nRendered creative refinement or downstream verification did not complete successfully. Inspect GitHub Actions run %s.\n' '${{ github.run_id }}' >> "$RUNNER_TEMP/revision-outcome.txt"
          DETAILS=$(sed -n '1,80p' "$RUNNER_TEMP/revision-outcome.txt")
          gh pr comment "$CLIENT_PR" --repo "$CLIENT_REPO" --body "$(printf '%s\n\n%s\n\n%s\n\n%s' '<!-- launchloom-manual-attention:developer -->' '## Manual attention needed' 'The requested feedback was preserved, but the revised preview did not pass every downstream gate. No completion email was sent.' "$DETAILS")"
      - name: Pause revision queue after workflow failure
        if: always() && steps.claim.outputs.run == 'true' && steps.complete.outcome != 'success'
        env:
          REVISION_QUEUE_ACTION: fail
          REVISION_FAILURE_SITE_URL: ${{ steps.deploy.outputs.preview || github.event.client_payload.reviewedPage }}
          REVISION_FAILURE_RUN_URL: https://github.com/WrazyAI/launchloom/actions/runs/${{ github.run_id }}
        run: |
          DETAILS=$(test -f "$RUNNER_TEMP/revision-outcome.txt" && tr '\n' ' ' < "$RUNNER_TEMP/revision-outcome.txt" || printf '%s' 'No validated revision outcome was produced.')
          export REVISION_FAILURE_REASON="Developer revision workflow failed. $DETAILS Inspect GitHub Actions run ${{ github.run_id }}."
          node scripts/revision-queue-client.mjs
      - name: Record revision tracking
        if: always() && steps.claim.outputs.run == 'true'
        continue-on-error: true
        env:
          REVISION_PREVIEW: ${{ steps.deploy.outputs.preview }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          case "$CLIENT_REPO" in
            WrazyAI/launchloom-[0-9]*-*) ;;
            *) echo "generation_tracking=skipped reason=non-standard-repo"; exit 0 ;;
          esac
          ISSUE=$(printf '%s' "$CLIENT_REPO" | sed -E 's#^WrazyAI/launchloom-([0-9]+)-.*#\1#')
          STATUS=attention
          EVENT_STATUS=failed
          FAILURE="Developer revision workflow $WORKFLOW_RUN_ID stopped before a reviewable developer preview. Inspect the preserved feedback."
          if [ "${{ steps.complete.outcome }}" = "success" ]; then
            STATUS=revision
            EVENT_STATUS=completed
            FAILURE=""
          fi
          node scripts/generation-cost-summary.mjs \
            --revision-dir "$RUNNER_TEMP/revision-screenshots" \
            --repair-dir "$RUNNER_TEMP/human-revision" \
            --output /tmp/revision-cost.json
          EVENT_STATUS="$EVENT_STATUS" REVISION_REQUEST_ID="$REVISION_REQUEST_ID" REVISION_PR="$CLIENT_PR" REVISION_PREVIEW="$REVISION_PREVIEW" node -e '
            const fs = require("node:fs");
            fs.writeFileSync("/tmp/revision-event.json", JSON.stringify([{
              eventKey: "revision:" + String(process.env.REVISION_REQUEST_ID || "unknown").slice(0, 60),
              stage: "revision",
              status: process.env.EVENT_STATUS,
              provider: "openrouter",
              model: null,
              costUsd: null,
              costKind: "unreported",
              detail: {
                requestId: process.env.REVISION_REQUEST_ID || null,
                pr: Number(process.env.REVISION_PR || 0) || null,
                previewUrl: process.env.REVISION_PREVIEW || null,
                notes: process.env.EVENT_STATUS === "completed"
                  ? "Developer feedback was applied to a revised preview awaiting approval."
                  : "The revision stopped short of a reviewable developer preview.",
              },
            }]));
          '
          ARGS=(
            --action complete
            --issue "$ISSUE"
            --repo "$CLIENT_REPO"
            --pr "$CLIENT_PR"
            --status "$STATUS"
            --events /tmp/revision-event.json
            --cost-summary /tmp/revision-cost.json
            --completed-at "$(date +%s%3N)"
          )
          if [ -n "$REVISION_PREVIEW" ]; then ARGS+=(--preview-url "$REVISION_PREVIEW"); fi
          if [ -n "$FAILURE" ]; then ARGS+=(--failure "$FAILURE"); fi
          node scripts/record-generation-event.mjs "${ARGS[@]}"
      - name: Preserve failed revision evidence
        if: failure() && steps.claim.outputs.run == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: developer-revision-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/revision-screenshots
          if-no-files-found: warn
          retention-days: 3
