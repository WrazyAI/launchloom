name: Resolve revision queue

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Client repository
        required: true
        type: string
      request_id:
        description: Failed revision request ID
        required: true
        type: string
      action:
        description: Resolution action
        required: true
        type: choice
        options: [dismiss, resume]
      reason:
        description: Resolution note
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Resolve revision queue entry
        env:
          REVISION_QUEUE_ACTION: ${{ inputs.action }}
          CLIENT_REPO: ${{ inputs.repo }}
          REVISION_REQUEST_ID: ${{ inputs.request_id }}
          REVISION_COORDINATOR_SECRET: ${{ secrets.REVISION_COORDINATOR_SECRET }}
          REVISION_FAILURE_REASON: ${{ inputs.reason }}
          LAUNCHLOOM_API_URL: https://api.launchloom.wrazyos.com
        run: node scripts/revision-queue-client.mjs
