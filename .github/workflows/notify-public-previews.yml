name: Notify clients when previews become public

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: launchloom-public-preview-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.LAUNCHLOOM_GITHUB_ORG_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      LAUNCHLOOM_FROM_EMAIL: ${{ vars.LAUNCHLOOM_FROM_EMAIL }}
      LAUNCHLOOM_GITHUB_REPOSITORY: WrazyAI/launchloom
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Send each newly public preview email once
        run: node scripts/notify-public-previews.mjs
