name: Validate LaunchLoom changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Run application tests
        run: npm test
      - name: Run worker tests
        run: npm run test:worker
      - name: Check Astro and TypeScript
        run: |
          npm run check
          npm run check:worker
      - name: Build production bundle
        run: npm run build
  route-fixtures:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Verify synthetic approved-route matrix
        run: npm run verify:site-route-fixtures
      - name: Retain private fixture route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-route-verification
          path: |
            artifacts/stage4/*/route-handoff.json
            artifacts/stage4/*/screenshots
          if-no-files-found: ignore
          retention-days: 7
