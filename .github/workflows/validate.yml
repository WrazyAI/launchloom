name: Validate LaunchLoom changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Run application tests
        run: npm test
      - name: Run worker tests
        run: npm run test:worker
      - name: Check Astro and TypeScript
        run: |
          npm run check
          npm run check:worker
      - name: Build production bundle
        run: npm run build
      - name: Build client production template
        working-directory: templates/client-site
        run: |
          npm ci
          npm run check
          npm run build
      - name: Reproduce pre-fix feedback, email, and SEO behavior
        run: |
          git worktree add "$RUNNER_TEMP/pre-fix" e52b4f2c66921cb315063d881d5e01a03a406578
          cd "$RUNNER_TEMP/pre-fix"
          npm ci
          npx vitest run --config vitest.worker.config.ts worker/test/client-feedback.test.ts -t "reproduces a transient dispatch error as a browser-visible failure after feedback was recorded"
          node --input-type=module - <<'NODE'
          const { renderLifecycleEmail } = await import("./emails/render-email.mjs");
          const failedEmail = renderLifecycleEmail({
            audience: "manual-attention",
            kind: "revision-failed",
            clientName: "Runtime fixture",
            previewUrl: "https://github.com/WrazyAI/example-client/pull/44",
            reviewUrl: "https://github.com/WrazyAI/example-client/pull/44"
          });
          const primaryHref = failedEmail.html.match(/href="([^"]+)"/u)?.[1] || "";
          if (primaryHref !== "https://github.com/WrazyAI/example-client/pull/44")
            throw new Error("Pre-fix failure email did not reproduce the GitHub-only primary action.");
          console.log("prefx_failed_revision_primary=github");

          const { researchSiteContext } = await import("./scripts/seo-research.mjs");
          const originalFetch = globalThis.fetch;
          let fetchCalls = 0;
          globalThis.fetch = async () => {
            fetchCalls += 1;
            throw new Error("Unexpected online research call.");
          };
          try {
            const dossier = await researchSiteContext({
              businessName: "Runtime SEO fixture",
              industry: "home-services",
              services: ["drain cleaning"],
              primaryCity: "Tacoma, WA"
            }, {});
            if (fetchCalls !== 0) throw new Error("Pre-fix SEO unexpectedly performed online research.");
            if (dossier.mode !== "context-only" || dossier.publishReady !== false)
              throw new Error("Pre-fix SEO reproduction did not remain context-only.");
            console.log("prefx_no_dataforseo_fetch_calls=0");
            console.log("prefx_no_dataforseo_mode=context-only");
          } finally {
            globalThis.fetch = originalFetch;
          }
          NODE
      - name: Smoke no-DataForSEO online fallback
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DATAFORSEO_LOGIN: ""
          DATAFORSEO_USERNAME: ""
          DATAFORSEO_PASSWORD: ""
          SEO_FALLBACK_MAX_QUERIES: "1"
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "seo_live_smoke=skipped_openrouter_secret_unavailable"
            exit 0
          fi
          cat > "$RUNNER_TEMP/seo-smoke.md" <<'EOF'
          ```json
          {
            "businessName": "LaunchLoom SEO Smoke Fixture",
            "industry": "home-services",
            "services": ["drain cleaning"],
            "primaryCity": "Tacoma, WA",
            "serviceAreas": ["Tacoma, WA"],
            "serviceRadius": "20"
          }
          ```
          EOF
          node scripts/seo-research.mjs --source "$RUNNER_TEMP/seo-smoke.md" --out "$RUNNER_TEMP/seo-smoke.json"
          node - <<'NODE'
          const x = require(process.env.RUNNER_TEMP + "/seo-smoke.json");
          const evidence = Array.isArray(x.externalSearchEvidence) ? x.externalSearchEvidence : [];
          if (x.publishReady !== false) throw new Error("Fallback smoke unexpectedly marked production SEO ready.");
          if (x.mode !== "context-only") throw new Error("Fallback smoke must remain context-only.");
          if (!["complete", "partial"].includes(x.fallbackSearch?.status)) throw new Error("Fallback search did not return live evidence.");
          if (x.fallbackSearch?.queriesAttempted !== 1) throw new Error("Fallback smoke exceeded or missed the one-query bound.");
          if (!evidence.length) throw new Error("Fallback smoke returned no cited evidence.");
          for (const item of evidence) {
            if (!/^https:\/\//u.test(item.sourceUrl || "")) throw new Error("Fallback evidence is missing a safe source URL.");
            if (item.provenance !== "external_search_observation") throw new Error("Fallback evidence provenance is not explicit.");
            if (!item.retrievedAt || !item.provider) throw new Error("Fallback evidence is missing retrieval/provider provenance.");
          }
          console.log("seo_live_smoke=passed");
          console.log("seo_live_smoke_evidence_count=" + evidence.length);
          console.log("seo_live_smoke_status=" + x.fallbackSearch.status);
          NODE
