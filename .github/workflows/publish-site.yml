name: Publish approved site

on:
  repository_dispatch:
    types: [publish-site]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      LAUNCHLOOM_FROM_EMAIL: ${{ vars.LAUNCHLOOM_FROM_EMAIL }}
      LAUNCHLOOM_DEVELOPER_EMAIL: ${{ vars.LAUNCHLOOM_DEVELOPER_EMAIL }}
      LAUNCHLOOM_API_URL: https://api.launchloom.wrazyos.com
    steps:
      # The signed-link and mail scripts live in the private LaunchLoom control
      # repository, not in the generated client repository cloned below.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare private production workspace
        run: |
          umask 077
          LAUNCHLOOM_PRIVATE_DIR="$RUNNER_TEMP/launchloom-private-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$LAUNCHLOOM_PRIVATE_DIR"
          chmod 700 "$LAUNCHLOOM_PRIVATE_DIR"
          echo "LAUNCHLOOM_PRIVATE_DIR=$LAUNCHLOOM_PRIVATE_DIR" >> "$GITHUB_ENV"
          test "$(stat -c '%a' "$LAUNCHLOOM_PRIVATE_DIR")" = 700
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Install trusted tools and rendered browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/launchloom-playwright-browsers-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npm ci
          mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          chmod 755 "$PLAYWRIGHT_BROWSERS_PATH"
          npx playwright install --with-deps chromium
          chmod -R a+rX "$PLAYWRIGHT_BROWSERS_PATH"
      - name: Build and verify approved client site
        id: verified
        env:
          CLIENT_REPO: ${{ github.event.client_payload.repo }}
          CLIENT_EMAIL: ${{ github.event.client_payload.clientEmail }}
          FEEDBACK_ISSUE: ${{ github.event.client_payload.feedbackIssue }}
          APPROVED_SHA: ${{ github.event.client_payload.approvedSha }}
          GH_TOKEN: ${{ secrets.LAUNCHLOOM_GITHUB_ORG_TOKEN }}
          LAUNCHLOOM_CLIENT_PROCESS_ISOLATION: required
          PLAYWRIGHT_BROWSERS_PATH: /tmp/launchloom-playwright-browsers-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -n "$CLIENT_REPO" && test -n "$CLIENT_EMAIL" && test -n "$FEEDBACK_ISSUE" && test -n "$APPROVED_SHA"
          [[ "$CLIENT_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "Client repository identifier is invalid." >&2; exit 1; }
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Approved revision must be a full commit SHA." >&2; exit 1; }
          CLIENT_DIR="$LAUNCHLOOM_PRIVATE_DIR/client"
          GIT_AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $GIT_AUTH" git clone "https://github.com/$CLIENT_REPO.git" "$CLIENT_DIR"
          unset GIT_AUTH
          REMOTE_URL=$(git -C "$CLIENT_DIR" remote get-url origin)
          [[ "$REMOTE_URL" == "https://github.com/$CLIENT_REPO.git" && "$REMOTE_URL" != *'@'* ]] || { echo "Client origin contains persisted credentials or an unexpected host." >&2; exit 1; }
          (cd "$CLIENT_DIR" && bash "$GITHUB_WORKSPACE/scripts/git-with-token.sh" fetch origin "$APPROVED_SHA")
          git -C "$CLIENT_DIR" checkout --detach "$APPROVED_SHA"
          test "$(git -C "$CLIENT_DIR" rev-parse HEAD)" = "$APPROVED_SHA" || { echo "Approved commit checkout mismatch"; exit 1; }
          PROJECT=$(node -e "console.log(require('$CLIENT_DIR/.launchloom-deployment.json').project)")
          [[ "$PROJECT" =~ ^[a-z0-9-]{1,58}$ ]] || { echo "Client deployment project name is invalid." >&2; exit 1; }
          PRODUCTION="https://$PROJECT.pages.dev"
          BUILD_ROOT=$(mktemp -d "$RUNNER_TEMP/launchloom-approved-build.XXXXXX")
          chmod 755 "$BUILD_ROOT"
          BUILD_DIR="$BUILD_ROOT/site"
          SCREENSHOTS="$BUILD_ROOT/screenshots"
          node "$GITHUB_WORKSPACE/scripts/prepare-client-build-copy.mjs" --source "$CLIENT_DIR" --target "$BUILD_DIR"
          node "$GITHUB_WORKSPACE/scripts/run-isolated-client-command.mjs" --cwd "$BUILD_DIR" --writable "$BUILD_ROOT" -- npm ci --package-lock=true
          node "$GITHUB_WORKSPACE/scripts/run-isolated-client-command.mjs" --cwd "$BUILD_DIR" --writable "$BUILD_ROOT" --env.PUBLIC_SITE_URL "$PRODUCTION" --env.PUBLIC_LAUNCHLOOM_API_URL "$LAUNCHLOOM_API_URL" -- npm run build
          node "$GITHUB_WORKSPACE/scripts/run-isolated-client-command.mjs" --cwd "$BUILD_DIR" --writable "$BUILD_ROOT" --env.PUBLIC_REVIEW_MODE false -- node "$GITHUB_WORKSPACE/scripts/verify-rendered-revision.mjs" --config src/site.config.json --dist dist --screenshots "$SCREENSHOTS"
          chmod 700 "$BUILD_ROOT"
          node "$GITHUB_WORKSPACE/scripts/seo-release-gate.mjs" --mode production --config "$BUILD_DIR/src/site.config.json" --dist "$BUILD_DIR/dist" --origin "$PRODUCTION"
          if grep -R -I -F -q --include='*.html' --include='*.css' --include='*.js' --include='*.json' --include='*.svg' --include='*.txt' "—" "$BUILD_DIR/dist"; then echo "Generated page contains an em dash" >&2; exit 1; fi
          SAFE_DEPLOY_DIR=$(node "$GITHUB_WORKSPACE/scripts/prepare-safe-static-output.mjs" --source "$BUILD_DIR/dist" --parent "$RUNNER_TEMP")
          echo "client_dir=$CLIENT_DIR" >> "$GITHUB_OUTPUT"
          echo "build_dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          echo "safe_deploy_dir=$SAFE_DEPLOY_DIR" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "production=$PRODUCTION" >> "$GITHUB_OUTPUT"
          echo "sha=$APPROVED_SHA" >> "$GITHUB_OUTPUT"
      - name: Deploy approved site and send delivery link
        if: steps.verified.outputs.build_dir != ''
        env:
          CLIENT_REPO: ${{ github.event.client_payload.repo }}
          CLIENT_EMAIL: ${{ github.event.client_payload.clientEmail }}
          FEEDBACK_ISSUE: ${{ github.event.client_payload.feedbackIssue }}
          GH_TOKEN: ${{ secrets.LAUNCHLOOM_GITHUB_ORG_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REVIEW_SIGNING_SECRET: ${{ secrets.REVIEW_SIGNING_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLIENT_DIR: ${{ steps.verified.outputs.client_dir }}
          BUILD_DIR: ${{ steps.verified.outputs.build_dir }}
          PROJECT: ${{ steps.verified.outputs.project }}
          PRODUCTION: ${{ steps.verified.outputs.production }}
          APPROVED_SHA: ${{ steps.verified.outputs.sha }}
          SAFE_DEPLOY_DIR: ${{ steps.verified.outputs.safe_deploy_dir }}
        run: |
          cd "$CLIENT_DIR"
          "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" pages deploy "$SAFE_DEPLOY_DIR" --project-name "$PROJECT" --commit-hash "$APPROVED_SHA" --commit-message "LaunchLoom approved deployment"
          TOKEN=$(node "$GITHUB_WORKSPACE/scripts/create-review-link.mjs" --stage client --repo "$CLIENT_REPO" --site "$PROJECT" --email "$CLIENT_EMAIL" --client-email "$CLIENT_EMAIL" --feedback-issue "$FEEDBACK_ISSUE" --origins "$PRODUCTION" --token-only true)
          NAME="$(node -e 'const x=require("./src/site.config.json"); console.log(x.business.name)')"
          REVIEW_URL="$PRODUCTION?review=$TOKEN"
          EMAIL_ARGS=(--to "$CLIENT_EMAIL" --name "$NAME" --preview "$PRODUCTION" --review "$REVIEW_URL" --kind published --audience client)
          node -e 'const fs=require("node:fs"); const x=require("./src/site.config.json"); const report=x.revisionReport || {}; const items=Array.isArray(report.clientFeedbackContext) && report.clientFeedbackContext.length ? report.clientFeedbackContext : report.stage === "client" && Array.isArray(report.feedback) ? report.feedback : []; const feedback=[...new Set(items.map(item => String(item || "").trim()).filter(Boolean))].join("\n\n"); if (feedback) fs.writeFileSync(process.env.LAUNCHLOOM_PRIVATE_DIR + "/client-approved-feedback.txt", feedback)'
          if [ -s "$LAUNCHLOOM_PRIVATE_DIR/client-approved-feedback.txt" ]; then
            EMAIL_ARGS+=(--feedback-file "$LAUNCHLOOM_PRIVATE_DIR/client-approved-feedback.txt")
          fi
          if ! node "$GITHUB_WORKSPACE/scripts/send-preview-email.mjs" "${EMAIL_ARGS[@]}"; then
            gh issue comment "$FEEDBACK_ISSUE" --repo "$CLIENT_REPO" --body "<!-- launchloom-client-delivery-failed -->\n\nProduction deployed, but client email delivery failed. The developer has been notified to verify the recipient and send the production review link manually."
            node "$GITHUB_WORKSPACE/scripts/send-preview-email.mjs" --to "$LAUNCHLOOM_DEVELOPER_EMAIL" --name "$NAME" --preview "$PRODUCTION" --review "$REVIEW_URL" --kind published --audience delivery-failure || true
            exit 1
          fi
