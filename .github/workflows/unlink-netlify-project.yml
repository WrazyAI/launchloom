name: Unlink legacy Netlify project

on:
  workflow_dispatch:

permissions: {}

jobs:
  unlink:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_PLATFORM_SITE_ID: ${{ secrets.NETLIFY_PLATFORM_SITE_ID }}
    steps:
      - name: Unlink the legacy Netlify repository
        shell: bash
        run: |
          set -euo pipefail

          : "${NETLIFY_AUTH_TOKEN:?NETLIFY_AUTH_TOKEN is required}"
          : "${NETLIFY_PLATFORM_SITE_ID:?NETLIFY_PLATFORM_SITE_ID is required}"

          api="https://api.netlify.com/api/v1/sites/${NETLIFY_PLATFORM_SITE_ID}"
          auth=(--header "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}")

          before="$(curl --fail --silent --show-error "${auth[@]}" "$api")"
          printf '%s\n' "$before" | jq '{id, name, repositoryLinked: (.repo != null)}'

          curl --fail --silent --show-error --request PUT "${auth[@]}" "$api/unlink_repo" >/dev/null

          after="$(curl --fail --silent --show-error "${auth[@]}" "$api")"
          printf '%s\n' "$after" | jq '{id, name, repositoryLinked: (.repo != null)}'
          test "$(printf '%s\n' "$after" | jq -r 'if .repo == null then "false" else "true" end')" = false
