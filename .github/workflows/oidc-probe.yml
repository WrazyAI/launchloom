name: OIDC probe
on:
  workflow_dispatch:
  repository_dispatch:
    types: [oidc-probe]
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check OIDC
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then echo "oidc_url=present"; else echo "oidc_url=missing"; fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then echo "oidc_token=present"; else echo "oidc_token=missing"; fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            node -e 'const u=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL); console.log("probe_protocol="+u.protocol+" probe_hostname="+u.hostname+" probe_user="+Boolean(u.username)+" probe_password="+Boolean(u.password)+" probe_hash="+Boolean(u.hash))'
            code=$(curl -sS -o /tmp/oidc.json -w '%{http_code}' -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-none}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=launchloom-operations" || true)
            echo "oidc_http=$code"
            node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/oidc.json","utf8"));const c=JSON.parse(Buffer.from(j.value.split(".")[1],"base64url"));console.log(JSON.stringify({sub:c.sub,aud:c.aud,event_name:c.event_name,repository_id:c.repository_id,repository:c.repository,ref:c.ref,workflow_ref:c.workflow_ref,ref_type:c.ref_type}))'
          fi
  probe_custom:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash scripts/private-run.sh {0}
    steps:
      - uses: actions/checkout@v5
      - name: Check OIDC through the custom shell
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then echo "custom_url=present"; else echo "custom_url=missing"; fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then echo "custom_token=present"; else echo "custom_token=missing"; fi
