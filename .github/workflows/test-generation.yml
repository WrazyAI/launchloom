name: Focused generation test
run-name: >-
  LLGEN issue=${{ (toJSON(inputs.issue) == format('{0}', inputs.issue) && inputs.issue > 0) && inputs.issue || 0 }} profile=${{ contains(fromJSON('["full","full-preview","creative-only","seo-only"]'), inputs.test_profile) && inputs.test_profile || 'excluded' }} request=none

on:
  workflow_call:
    inputs:
      issue:
        required: true
        type: string
      test_profile:
        required: true
        type: string
      fast_lane:
        required: false
        default: false
        type: boolean
      candidate_repository:
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: read
  id-token: write

concurrency:
  group: focused-generation-${{ inputs.issue }}-${{ inputs.test_profile }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  focused:
    runs-on: ubuntu-24.04
    # Authoring keeps its own 100-minute fail-closed budget; the creative
    # repair loop can legitimately spend longer once repairs succeed on Go
    # (builds, judges, sweeps, and bounded retry cooldowns), so the runner
    # timeout stays above the whole pipeline budget.
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ secrets.LAUNCHLOOM_GITHUB_ORG_TOKEN }}
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      # OpenCode Go is the only production inference upstream. The code
      # rejects `openrouter`.
      CREATIVE_EXPERIENCE_PROVIDER: opencode-go
      SITE_COPY_PROVIDER: opencode-go
      FAL_KEY: ${{ secrets.FAL_KEY }}
      FAL_IMAGE_MODEL: ${{ vars.FAL_IMAGE_MODEL || 'fal-ai/minimax/image-01' }}
      FAL_IMAGE_USD_PER_IMAGE: ${{ vars.FAL_IMAGE_USD_PER_IMAGE }}
      # Focused previews use the same image provider default as production.
      # Without this, the reusable workflow falls back to FAL and can fail
      # closed on a provider 403 before authoring.
      IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || 'workers-ai' }}
      WORKERS_AI_IMAGE_MODEL: ${{ vars.WORKERS_AI_IMAGE_MODEL || '@cf/black-forest-labs/flux-1-schnell' }}
      CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
      DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
      DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY || secrets.JEV_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      LAUNCHLOOM_TEST_PAGES_PROJECT: ${{ vars.LAUNCHLOOM_TEST_PAGES_PROJECT || 'launchloom-pipeline-preview' }}
      # Focused previews are Access-protected. The notification email routes
      # the developer through the Neon-authenticated Worker proxy.
      LAUNCHLOOM_ADMIN_ORIGIN: ${{ vars.ADMIN_PUBLIC_ORIGIN || 'https://api.launchloom.wrazyos.com' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GENERATION_TRACKING_SECRET: ${{ secrets.GENERATION_TRACKING_SECRET }}
      # uploadLiveCandidatePreview needs the API URL and the focused attempt
      # identity. The run id and attempt come from GitHub; these values bind
      # the live thumbnail to this exact focused run.
      LAUNCHLOOM_API_URL: ${{ vars.LAUNCHLOOM_API_URL || 'https://api.launchloom.wrazyos.com' }}
      OPERATIONS_API_URL: ${{ vars.LAUNCHLOOM_OPERATIONS_API_URL || vars.LAUNCHLOOM_API_URL || 'https://api.launchloom.wrazyos.com' }}
      OPERATIONS_OIDC_AUDIENCE: ${{ vars.OPERATIONS_OIDC_AUDIENCE || 'launchloom-operations' }}
      TRACK_PROFILE: ${{ inputs.test_profile }}
      TRACK_ISSUE: ${{ inputs.issue }}
      TRACK_ATTEMPT: github:${{ github.run_id }}:${{ github.run_attempt }}
      TRACK_ACTOR: ${{ github.triggering_actor }}
      GENERATION_ACTIVITY_ENABLED: ${{ vars.GENERATION_ACTIVITY_ENABLED || 'false' }}
      GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      LAUNCHLOOM_FROM_EMAIL: ${{ vars.LAUNCHLOOM_FROM_EMAIL }}
      LAUNCHLOOM_DEVELOPER_EMAIL: ${{ vars.LAUNCHLOOM_DEVELOPER_EMAIL }}
      CREATIVE_EXPERIENCE_MODEL: deepseek/deepseek-v4.1-flash
      CREATIVE_EXPERIENCE_REASONING_EFFORT: ${{ vars.CREATIVE_EXPERIENCE_REASONING_EFFORT || 'max' }}
      # Repairs are bounded edits; high effort leaves output headroom for
      # max-effort-adjacent reasoning without truncating the answer.
      CREATIVE_REPAIR_EFFORT: ${{ vars.CREATIVE_REPAIR_EFFORT || 'high' }}
      # Creative-stage performance switches (defaults match the code; see
      # docs/creative-generation-performance.md).
      CREATIVE_EVIDENCE_REUSE: ${{ vars.CREATIVE_EVIDENCE_REUSE || 'true' }}
      CREATIVE_JUDGE_CONCURRENCY: ${{ vars.CREATIVE_JUDGE_CONCURRENCY || '2' }}
      CREATIVE_REPAIR_STAGNATION: ${{ vars.CREATIVE_REPAIR_STAGNATION || 'true' }}
      CREATIVE_NEAR_MISS_PREVIEW: ${{ vars.CREATIVE_NEAR_MISS_PREVIEW || 'true' }}
      CREATIVE_PIXEL_CONTRAST: ${{ vars.CREATIVE_PIXEL_CONTRAST || 'true' }}
      REASONING_PREFLIGHT_MODE: ${{ vars.REASONING_PREFLIGHT_MODE || 'shadow' }}
      REASONING_PREFLIGHT_MODEL: ${{ vars.REASONING_PREFLIGHT_MODEL || 'jev-1.13.0' }}
      SEO_RESEARCH_MAX_TASKS: ${{ vars.SEO_RESEARCH_MAX_TASKS || '16' }}
      SEO_RESEARCH_METRIC_LOCATION_NAME: ${{ vars.SEO_RESEARCH_METRIC_LOCATION_NAME || '' }}
      SEO_RESEARCH_MAX_USD: ${{ vars.SEO_RESEARCH_MAX_USD || '0.35' }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      SEO_FALLBACK_MAX_QUERIES: ${{ vars.SEO_FALLBACK_MAX_QUERIES || '5' }}
      SEO_FALLBACK_MAX_USD: ${{ vars.SEO_FALLBACK_MAX_USD || '0.05' }}
      SEO_FALLBACK_SEARCH_MODEL: ${{ vars.SEO_FALLBACK_SEARCH_MODEL || 'deepseek/deepseek-v4.1-flash' }}
      RUNNER_USD_PER_MINUTE: ${{ vars.RUNNER_USD_PER_MINUTE }}
      PUBLIC_REVIEW_MODE: "true"
      LAUNCHLOOM_READ_ONLY_HISTORY: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Register focused attempt and start setup
        continue-on-error: true
        run: node scripts/record-generation-stage.mjs --stage setup --status started
      - run: npm ci
      - name: Verify OpenCode Go credential
        run: |
          test -n "$OPENCODE_GO_API_KEY" || { echo "Missing: OPENCODE_GO_API_KEY" >&2; exit 1; }
      - name: Install rendered acceptance browser
        uses: ./.github/actions/install-playwright-chromium
      - name: Hydrate reference dossier PNGs from R2
        if: inputs.test_profile != 'seo-only'
        uses: ./.github/actions/hydrate-reference-assets
        with:
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Configure private QA repository authentication
        run: gh auth setup-git
      - name: Record focused setup completion
        continue-on-error: true
        run: node scripts/record-generation-stage.mjs --stage setup --status completed
      - name: Run focused profile
        env:
          TEST_ISSUE: ${{ inputs.issue }}
          TEST_PROFILE: ${{ inputs.test_profile }}
          TEST_FAST_LANE: ${{ inputs.fast_lane }}
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
        run: |
          ARGS=(--issue "$TEST_ISSUE" --test-profile "$TEST_PROFILE")
          if [ "$TEST_FAST_LANE" = "true" ]; then
            ARGS+=(--fast-lane)
          fi
          if [ -n "$CANDIDATE_REPOSITORY" ]; then
            ARGS+=(--candidate-repository "$CANDIDATE_REPOSITORY")
          fi
          node scripts/run-pipeline-test.mjs "${ARGS[@]}"
      # Evidence belongs in the isolated private QA repository. Never upload
      # intake, model responses, screenshots or reports to public artifacts.
      - name: Finalize generation activity
        if: always()
        continue-on-error: true
        env:
          GENERATION_OUTCOME: ${{ job.status }}
        run: node scripts/finalize-generation-activity.mjs
