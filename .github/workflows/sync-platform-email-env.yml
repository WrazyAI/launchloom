name: Sync platform email environment

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_PLATFORM_SITE_ID: ${{ secrets.NETLIFY_PLATFORM_SITE_ID }}
      NETLIFY_ACCOUNT_SLUG: ${{ secrets.NETLIFY_ACCOUNT_SLUG }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Put email settings in the LaunchLoom function environment
        run: |
          set_env () {
            KEY="$1"
            VALUE="$2"
            BASE="https://api.netlify.com/api/v1/accounts/$NETLIFY_ACCOUNT_SLUG/env/$KEY?site_id=$NETLIFY_PLATFORM_SITE_ID"
            EXISTS=$(curl --silent --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "$BASE")
            if [ "$EXISTS" = 200 ]; then
              PAYLOAD=$(node -e 'console.log(JSON.stringify({value:process.argv[1],context:"production"}))' "$VALUE")
              STATUS=$(curl --silent --show-error --output /tmp/netlify-env.json --write-out '%{http_code}' --request PATCH "$BASE" --header "Authorization: Bearer $NETLIFY_AUTH_TOKEN" --header 'Content-Type: application/json' --data "$PAYLOAD")
            else
              PAYLOAD=$(node -e 'console.log(JSON.stringify([{key:process.argv[1],scopes:["builds","functions","runtime","post-processing"],values:[{value:process.argv[2],context:"production"}]}]))' "$KEY" "$VALUE")
              STATUS=$(curl --silent --show-error --output /tmp/netlify-env.json --write-out '%{http_code}' --request POST "https://api.netlify.com/api/v1/accounts/$NETLIFY_ACCOUNT_SLUG/env?site_id=$NETLIFY_PLATFORM_SITE_ID" --header "Authorization: Bearer $NETLIFY_AUTH_TOKEN" --header 'Content-Type: application/json' --data "$PAYLOAD")
            fi
            echo "$KEY synced ($STATUS)"
            if [ "$STATUS" != 201 ]; then
              node -e 'try { const x=require("/tmp/netlify-env.json"); console.error(x.message || x.error || `Netlify API status ${process.argv[1]}`); } catch { console.error(`Netlify API status ${process.argv[1]}`); }' "$STATUS"
              exit 1
            fi
          }
          set_env RESEND_API_KEY "$RESEND_API_KEY"
          set_env LAUNCHLOOM_FROM_EMAIL 'LaunchLoom <info@wrazyos.com>'
          set_env LAUNCHLOOM_FEEDBACK_EMAIL 'david@maigreeks.com'
