name: Evaluate website-generation models

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Hydrate reference dossier PNGs from R2
        uses: ./.github/actions/hydrate-reference-assets
        with:
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npm run evaluate:models -- --out artifacts/model-evaluation.json
      - name: Upload blinded evaluation packet
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: launchloom-model-evaluation-review
          path: artifacts/model-evaluation.json.md
          retention-days: 3
