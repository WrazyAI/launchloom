name: Generate client site

on:
  repository_dispatch:
    types: [intake-submitted]
  workflow_dispatch:
    inputs:
      issue:
        description: LaunchLoom intake issue number
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.LAUNCHLOOM_GITHUB_ORG_TOKEN }}
      GITHUB_ORG_TOKEN: ${{ secrets.LAUNCHLOOM_GITHUB_ORG_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_ACCOUNT_SLUG: ${{ secrets.NETLIFY_ACCOUNT_SLUG }}
      REVIEW_SIGNING_SECRET: ${{ secrets.REVIEW_SIGNING_SECRET }}
      LAUNCHLOOM_PUBLIC_URL: ${{ vars.LAUNCHLOOM_PUBLIC_URL }}
      LAUNCHLOOM_GITHUB_REPOSITORY: WrazyAI/launchloom
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read and generate from intake
        id: intake
        env:
          ISSUE: ${{ github.event.client_payload.issue || inputs.issue }}
        run: |
          gh api "repos/WrazyAI/launchloom/issues/$ISSUE" --jq .body > /tmp/intake.md
          node scripts/generate-site-config.mjs --source /tmp/intake.md --out /tmp/site.config.json
          SLUG=$(node -e 'const x=require("/tmp/site.config.json"); console.log(String(x.business?.name || "client-site").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"").slice(0,60) || "client-site")')
          test -n "$SLUG"
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
      - name: Create client repository and review PR
        id: client
        run: |
          SLUG="${{ steps.intake.outputs.slug }}"
          CLIENT_REPO="WrazyAI/$SLUG"
          gh repo create "$CLIENT_REPO" --private --description "Website generated by LaunchLoom" --disable-wiki
          CLIENT_DIR="$RUNNER_TEMP/$SLUG"
          cp -R templates/client-site "$CLIENT_DIR"
          cd "$CLIENT_DIR"
          git init --initial-branch=main
          git config user.name "LaunchLoom"
          git config user.email "automation@launchloom.app"
          git add .
          git commit -m "Add LaunchLoom site foundation"
          git remote add origin "https://x-access-token:${GITHUB_ORG_TOKEN}@github.com/$CLIENT_REPO.git"
          git push origin main
          git switch -c review/initial
          cp /tmp/site.config.json src/site.config.json
          git add src/site.config.json
          git commit -m "Create client site configuration"
          git push --set-upstream origin review/initial
          PR=$(gh pr create --repo "$CLIENT_REPO" --base main --head review/initial --title "Initial LaunchLoom site" --body "Private client preview generated from the verified intake.")
          echo "repo=$CLIENT_REPO" >> "$GITHUB_OUTPUT"
          echo "dir=$CLIENT_DIR" >> "$GITHUB_OUTPUT"
          echo "pr=${PR##*/}" >> "$GITHUB_OUTPUT"
      - name: Create Netlify site and preview deploy
        id: deploy
        run: |
          CLIENT_DIR="${{ steps.client.outputs.dir }}"
          SITE_JSON=$(node scripts/create-netlify-site.mjs "${{ steps.intake.outputs.slug }}")
          SITE_ID=$(echo "$SITE_JSON" | node -e "let x='';process.stdin.on('data',d=>x+=d).on('end',()=>console.log(JSON.parse(x).id))")
          printf '%s\n' "$SITE_JSON" > "$CLIENT_DIR/.launchloom-site.json"
          cd "$CLIENT_DIR"
          git add .launchloom-site.json
          git commit -m "Store deployment metadata"
          git push
          npm install
          npm run build
          npx netlify-cli@latest deploy --auth "$NETLIFY_AUTH_TOKEN" --site "$SITE_ID" --dir dist --json > /tmp/deploy.json
          echo "site_id=$SITE_ID" >> "$GITHUB_OUTPUT"
          echo "preview=$(node -e "const x=require('/tmp/deploy.json');console.log(x.deploy_url || x.url)")" >> "$GITHUB_OUTPUT"
      - name: Create secure review link
        id: review
        run: |
          CLIENT_DIR="${{ steps.client.outputs.dir }}"
          SHA=$(git -C "$CLIENT_DIR" rev-parse HEAD)
          LINK=$(node scripts/create-review-link.mjs --repo "${{ steps.client.outputs.repo }}" --pr "${{ steps.client.outputs.pr }}" --sha "$SHA" --site "${{ steps.deploy.outputs.site_id }}")
          echo "link=$LINK" >> "$GITHUB_OUTPUT"
      - name: Post handoff links
        run: |
          gh pr comment "${{ steps.client.outputs.pr }}" --repo "${{ steps.client.outputs.repo }}" --body "<!-- launchloom-revision -->\n## Initial preview\n\nPreview: ${{ steps.deploy.outputs.preview }}\n\nSecure client review: ${{ steps.review.outputs.link }}"
          gh issue comment "${{ steps.intake.outputs.issue }}" --repo WrazyAI/launchloom --body "## Client site ready\n\nRepository: ${{ steps.client.outputs.repo }}\nPreview: ${{ steps.deploy.outputs.preview }}\nReview link: ${{ steps.review.outputs.link }}"
