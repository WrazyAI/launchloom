name: Generate client site

on:
  repository_dispatch:
    types: [intake-submitted]
  workflow_dispatch:
    inputs:
      issue:
        description: LaunchLoom intake issue number
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.LAUNCHLOOM_GITHUB_ORG_TOKEN }}
      GITHUB_ORG_TOKEN: ${{ secrets.LAUNCHLOOM_GITHUB_ORG_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      REVIEW_SIGNING_SECRET: ${{ secrets.REVIEW_SIGNING_SECRET }}
      LEAD_SIGNING_SECRET: ${{ secrets.LEAD_SIGNING_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LAUNCHLOOM_FROM_EMAIL: ${{ vars.LAUNCHLOOM_FROM_EMAIL }}
      LAUNCHLOOM_DEVELOPER_EMAIL: ${{ vars.LAUNCHLOOM_DEVELOPER_EMAIL }}
      LAUNCHLOOM_API_URL: https://api.launchloom.wrazyos.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install rendered acceptance browser
        run: npx playwright install --with-deps chromium
      - name: Verify required secrets
        run: |
          for key in GITHUB_ORG_TOKEN OPENROUTER_API_KEY REVIEW_SIGNING_SECRET LEAD_SIGNING_SECRET CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RESEND_API_KEY LAUNCHLOOM_FROM_EMAIL LAUNCHLOOM_DEVELOPER_EMAIL; do test -n "${!key}" || { echo "Missing: $key"; exit 1; }; done
      - name: Read and generate from intake
        id: intake
        env:
          ISSUE: ${{ github.event.client_payload.issue || inputs.issue }}
        run: |
          gh api "repos/WrazyAI/launchloom/issues/$ISSUE" --jq .body > /tmp/intake.md
          node scripts/generate-site-config.mjs --source /tmp/intake.md --out /tmp/site.config.json
          SLUG=$(node -e 'const x=require("/tmp/site.config.json"); console.log(String(x.business?.name || "client-site").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"").slice(0,45) || "client-site")')
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "business_name=$(node -e 'const x=require("/tmp/site.config.json"); console.log(x.business.name)')" >> "$GITHUB_OUTPUT"
          echo "email=$(node -e 'const x=require("/tmp/site.config.json"); console.log(x.business.email)')" >> "$GITHUB_OUTPUT"
          echo "lead_email=$(node -e 'const x=require("/tmp/site.config.json"); console.log(x.business.leadEmail)')" >> "$GITHUB_OUTPUT"
          echo "assets=$(node -e 'const x=require("/tmp/site.config.json"); console.log(JSON.stringify(x.assets || {}))')" >> "$GITHUB_OUTPUT"
          echo "layout=$(node -e 'const x=require("/tmp/site.config.json"); console.log(x.conversion?.layout || "editorial-authority")')" >> "$GITHUB_OUTPUT"
          echo "asset_summary=$(node -e 'const x=require("/tmp/site.config.json"); console.log((x.assetReport?.used || []).map(a => a.asset + " → " + a.placement).join(", ") || "No supplied image used; approved contextual fallback or brand art selected.")')" >> "$GITHUB_OUTPUT"
      - name: Create private repository and Cloudflare Pages project
        id: client
        run: |
          PROJECT="launchloom-${{ steps.intake.outputs.issue }}-${{ steps.intake.outputs.slug }}"
          # Keep preview hostnames within the length proven to receive a
          # Pages preview certificate. Branch aliases add `review-initial.`
          # before this project label, so the normal Pages project maximum is
          # too long for reliable preview TLS in this account.
          PROJECT=$(echo "$PROJECT" | tr '[:upper:]' '[:lower:]' | cut -c1-39 | sed 's/-$//')
          CLIENT_REPO="WrazyAI/$PROJECT"
          if ! gh repo view "$CLIENT_REPO" >/dev/null 2>&1; then gh repo create "$CLIENT_REPO" --private --description "Website generated by LaunchLoom" --disable-wiki; fi
          if ! npx wrangler pages project list | awk '{print $1}' | grep -Fxq "$PROJECT"; then npx wrangler pages project create "$PROJECT" --production-branch main; fi
          # Pages issues preview-subdomain certificates only after a first
          # production deployment. This neutral, noindex placeholder is not a
          # client website and lets the following developer preview open
          # immediately without publishing client content.
          npx wrangler pages deploy "$GITHUB_WORKSPACE/templates/preview-placeholder" --project-name "$PROJECT" --commit-hash "$GITHUB_SHA" --commit-message "Prepare LaunchLoom preview certificate"
          gh label create launchloom-client-feedback --repo "$CLIENT_REPO" --color 1d76db --description "LaunchLoom client feedback inbox" --force
          INBOX=$(gh issue list --repo "$CLIENT_REPO" --state open --label launchloom-client-feedback --limit 1 --json url --jq '.[0].url // ""')
          if [ -z "$INBOX" ]; then
            INBOX=$(gh issue create --repo "$CLIENT_REPO" --title "LaunchLoom client feedback inbox" --label launchloom-client-feedback --body "Durable inbox for client-requested changes. Client feedback is reviewed internally before publishing.")
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "repo=$CLIENT_REPO" >> "$GITHUB_OUTPUT"
          echo "feedback_issue=${INBOX##*/}" >> "$GITHUB_OUTPUT"
      - name: Build private review branch
        id: branch
        run: |
          PROJECT="${{ steps.client.outputs.project }}"
          CLIENT_REPO="${{ steps.client.outputs.repo }}"
          CLIENT_DIR="$RUNNER_TEMP/$PROJECT"
          PREVIEW="https://review-initial.$PROJECT.pages.dev"
          PRODUCTION="https://$PROJECT.pages.dev"
          ORIGINS="$PREVIEW,$PRODUCTION"
          LEAD_TOKEN=$(node scripts/create-lead-token.mjs --project "$PROJECT" --recipient "${{ steps.intake.outputs.lead_email }}" --origins "$ORIGINS")
          PLACE_ID=$(node -e 'const x=require("/tmp/site.config.json"); console.log(x.business.placeId || "")')
          REVIEW_ARGS=()
          if [ -n "$PLACE_ID" ]; then
            REVIEWS_TOKEN=$(node scripts/create-google-reviews-token.mjs --project "$PROJECT" --placeId "$PLACE_ID" --origins "$ORIGINS")
            REVIEW_ARGS=(--reviewsToken "$REVIEWS_TOKEN")
          fi
          CHAT_ARGS=()
          CHAT_ENABLED=$(node -e 'const x=require("/tmp/site.config.json"); console.log(x.conversion?.aiChat?.enabled ? "true" : "false")')
          if [ "$CHAT_ENABLED" = true ]; then
            CHAT_TOKEN=$(node scripts/create-ai-chat-token.mjs --project "$PROJECT" --file /tmp/site.config.json --origins "$ORIGINS")
            CHAT_ARGS=(--chatToken "$CHAT_TOKEN")
          fi
          node scripts/enrich-site-config.mjs --file /tmp/site.config.json --assets '${{ steps.intake.outputs.assets }}' --api "$LAUNCHLOOM_API_URL" --leadToken "$LEAD_TOKEN" "${REVIEW_ARGS[@]}" "${CHAT_ARGS[@]}"
          REMOTE="https://x-access-token:${GITHUB_ORG_TOKEN}@github.com/$CLIENT_REPO.git"
          if git ls-remote --exit-code --heads "$REMOTE" review/initial >/dev/null 2>&1; then
            gh repo clone "$CLIENT_REPO" "$CLIENT_DIR" -- --branch review/initial
            cp -R templates/client-site/. "$CLIENT_DIR/"
          else
            cp -R templates/client-site "$CLIENT_DIR"
          fi
          node scripts/sync-client-guidelines.mjs "$CLIENT_DIR"
          cd "$CLIENT_DIR"
          rm -f netlify.toml
          printf '{"provider":"cloudflare-pages","project":"%s"}\n' "$PROJECT" > .launchloom-deployment.json
          if [ ! -d .git ]; then
            git init --initial-branch=main
            git config user.name "LaunchLoom"
            git config user.email "automation@launchloom.app"
            git add .
            git commit -m "Add LaunchLoom site foundation"
            git remote add origin "$REMOTE"
            git push origin main
            git switch -c review/initial
          else
            git config user.name "LaunchLoom"
            git config user.email "automation@launchloom.app"
            git remote set-url origin "$REMOTE"
          fi
          cp /tmp/site.config.json src/site.config.json
          git add .
          if ! git diff --cached --quiet; then git commit -m "Create client site configuration"; fi
          git push --set-upstream origin review/initial
          PR=$(gh pr list --repo "$CLIENT_REPO" --state open --head review/initial --json url --jq '.[0].url // ""')
          if [ -z "$PR" ]; then
            PR=$(gh pr create --repo "$CLIENT_REPO" --base main --head review/initial --title "Initial LaunchLoom site" --body "Private developer preview generated from the verified intake.\n\n<!-- launchloom-feedback-inbox:${{ steps.client.outputs.feedback_issue }} -->")
          fi
          echo "dir=$CLIENT_DIR" >> "$GITHUB_OUTPUT"
          echo "pr=${PR##*/}" >> "$GITHUB_OUTPUT"
      - name: Build and direct-upload public preview
        id: deploy
        run: |
          cd "${{ steps.branch.outputs.dir }}"
          npm ci
          PUBLIC_LAUNCHLOOM_API_URL="$LAUNCHLOOM_API_URL" npm run build
          node "$GITHUB_WORKSPACE/scripts/verify-rendered-revision.mjs" --config src/site.config.json --dist dist --screenshots "$RUNNER_TEMP/initial-screenshots"
          if grep -R -F -q "—" dist; then echo "Generated page contains an em dash"; exit 1; fi
          npx wrangler pages deploy dist --project-name "${{ steps.client.outputs.project }}" --branch review-initial --commit-hash "$(git rev-parse HEAD)" --commit-message "Initial LaunchLoom preview"
          echo "preview=https://review-initial.${{ steps.client.outputs.project }}.pages.dev" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload rendered initial evidence
        uses: actions/upload-artifact@v4
        with:
          name: initial-site-screenshots
          path: ${{ runner.temp }}/initial-screenshots
          retention-days: 14
      - name: Track pending developer delivery
        run: |
          gh label create launchloom-delivery-pending --repo "${{ steps.client.outputs.repo }}" --color e4e669 --force
          gh pr edit "${{ steps.branch.outputs.pr }}" --repo "${{ steps.client.outputs.repo }}" --add-label launchloom-delivery-pending
      - name: Wait for secure preview URL
        run: node scripts/wait-for-pages-preview.mjs --url "${{ steps.deploy.outputs.preview }}"
      - name: Create secure review link
        id: review
        run: |
          PREVIEW="${{ steps.deploy.outputs.preview }}"
          ORIGINS="$PREVIEW,https://${{ steps.client.outputs.project }}.pages.dev"
          TOKEN=$(node scripts/create-review-link.mjs --stage developer --repo "${{ steps.client.outputs.repo }}" --pr "${{ steps.branch.outputs.pr }}" --sha "${{ steps.deploy.outputs.sha }}" --site "${{ steps.client.outputs.project }}" --email "$LAUNCHLOOM_DEVELOPER_EMAIL" --client-email "${{ steps.intake.outputs.email }}" --feedback-issue "${{ steps.client.outputs.feedback_issue }}" --origins "$ORIGINS" --token-only true)
          echo "link=$PREVIEW?review=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Post handoff links
        run: |
          gh pr comment "${{ steps.branch.outputs.pr }}" --repo "${{ steps.client.outputs.repo }}" --body "$(printf '%s\n\n%s\n\nLayout: %s\nClient assets used: %s\n\nPreview: %s\n\nSecure developer review: %s' '<!-- launchloom-revision:developer -->' '## Initial developer preview' '${{ steps.intake.outputs.layout }}' '${{ steps.intake.outputs.asset_summary }}' '${{ steps.deploy.outputs.preview }}' '${{ steps.review.outputs.link }}')"
          gh issue comment "${{ steps.intake.outputs.issue }}" --repo WrazyAI/launchloom --body "$(printf '%s\n\n%s\n\nRepository: %s\nCloudflare Pages project: %s\nDeveloper preview: %s' '<!-- launchloom-developer-review-ready -->' '## Awaiting developer approval' '${{ steps.client.outputs.repo }}' '${{ steps.client.outputs.project }}' '${{ steps.deploy.outputs.preview }}')"
      - name: Send developer preview email
        run: |
          node scripts/send-preview-email.mjs --to "$LAUNCHLOOM_DEVELOPER_EMAIL" --name "${{ steps.intake.outputs.business_name }}" --preview "${{ steps.deploy.outputs.preview }}" --review "${{ steps.review.outputs.link }}" --kind initial --audience developer --idempotency-key "initial-${{ steps.client.outputs.project }}-${{ steps.deploy.outputs.sha }}"
          gh pr comment "${{ steps.branch.outputs.pr }}" --repo "${{ steps.client.outputs.repo }}" --body '<!-- launchloom-initial-email:${{ steps.deploy.outputs.sha }} -->'
          gh pr edit "${{ steps.branch.outputs.pr }}" --repo "${{ steps.client.outputs.repo }}" --remove-label launchloom-delivery-pending
      - name: Notify developer when generation stops
        if: failure()
        env:
          ISSUE: ${{ github.event.client_payload.issue || inputs.issue }}
        run: |
          NAME=$(gh issue view "$ISSUE" --repo WrazyAI/launchloom --json title --jq '.title | sub("^Intake: "; "")')
          printf 'Intake #%s could not be completed automatically. No client site or completion email should be assumed.\n' "$ISSUE" > "$RUNNER_TEMP/generation-failure-feedback.txt"
          printf 'Inspect GitHub Actions run %s, correct the failure, then rerun this exact intake.\n' '${{ github.run_id }}' > "$RUNNER_TEMP/generation-failure-outcome.txt"
          node scripts/send-preview-email.mjs --to "$LAUNCHLOOM_DEVELOPER_EMAIL" --name "$NAME" --preview "https://github.com/WrazyAI/launchloom/issues/$ISSUE" --review "https://github.com/WrazyAI/launchloom/actions/runs/${{ github.run_id }}" --kind generation-failed --audience manual-attention --feedback-file "$RUNNER_TEMP/generation-failure-feedback.txt" --outcome-file "$RUNNER_TEMP/generation-failure-outcome.txt" --idempotency-key "generation-failed-$ISSUE-${{ github.run_id }}"
