name: Generate client site

on:
  repository_dispatch:
    types: [intake-submitted]
  workflow_dispatch:
    inputs:
      issue:
        description: Intake issue number (not needed for access-only)
        required: false
        type: string
      test_profile:
        description: Full generation, isolated test preview, or no-intake Access smoke
        required: false
        type: choice
        options: [full, full-preview, seo-only, creative-only, access-only]
        default: full
      reuse_authored_candidates:
        description: Reuse a validated candidate set from an existing private client repository
        required: false
        type: boolean
        default: false
      candidate_repository:
        description: Existing private LaunchLoom client repository (required when reusing candidates)
        required: false
        type: string
      preview_only:
        description: Internal canary mode that skips the neutral production-branch bootstrap deploy
        required: false
        type: boolean
        default: false
      internal_qa_delivery:
        description: Route fresh fictional preview-only canary notifications and leads to the internal QA recipient secret
        required: false
        type: boolean
        default: false

      qa_repair_experiment:
        description: One-call-per-candidate experiment on verified fictional frozen QA previews only
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: launchloom-intake-${{ github.event.client_payload.issue || inputs.issue || github.run_id }}${{ github.event_name == 'workflow_dispatch' && (inputs.test_profile == 'full-preview' || inputs.test_profile == 'seo-only' || inputs.test_profile == 'creative-only') && format('-test-{0}-{1}', inputs.test_profile, github.run_id) || '' }}
  cancel-in-progress: false

jobs:
  profile_policy:
    runs-on: depot-ubuntu-24.04
    outputs:
      profile: ${{ steps.policy.outputs.profile }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Resolve generation execution policy
        id: policy
        env:
          REQUESTED_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_profile || 'full' }}
          REQUESTED_ISSUE: ${{ github.event.client_payload.issue || inputs.issue || '' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { resolveWorkflowTestDispatch } from './scripts/pipeline-test-policy.mjs';
          const policy = resolveWorkflowTestDispatch({
            profile: process.env.REQUESTED_PROFILE,
            eventName: process.env.GITHUB_EVENT_NAME,
            issue: process.env.REQUESTED_ISSUE,
          });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `profile=${policy.profile}\n`);
          NODE

  focused_test:
    needs: profile_policy
    if: ${{ needs.profile_policy.outputs.profile == 'full-preview' || needs.profile_policy.outputs.profile == 'seo-only' || needs.profile_policy.outputs.profile == 'creative-only' }}
    uses: ./.github/workflows/test-generation.yml
    with:
      issue: ${{ inputs.issue }}
      test_profile: ${{ needs.profile_policy.outputs.profile }}
      candidate_repository: ${{ inputs.candidate_repository || '' }}
    secrets: inherit

  private_preview_access_smoke:
    needs: profile_policy
    if: ${{ needs.profile_policy.outputs.profile == 'access-only' }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      LAUNCHLOOM_TEST_PAGES_PROJECT: ${{ vars.LAUNCHLOOM_TEST_PAGES_PROJECT || 'launchloom-pipeline-preview' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create a content-free probe
        run: node scripts/create-private-preview-probe.mjs "$RUNNER_TEMP/launchloom-access-smoke"
      - name: Verify anonymous denial and service-token access
        run: |
          BRANCH="access-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node scripts/deploy-private-diagnostic-preview.mjs \
            --directory "$RUNNER_TEMP/launchloom-access-smoke" \
            --source-sha "$GITHUB_SHA" \
            --branch "$BRANCH"

  intake_handoff_check:
    needs: profile_policy
    if: ${{ needs.profile_policy.outputs.profile == 'full' }}
    runs-on: depot-ubuntu-24.04
    outputs:
      completed: ${{ steps.marker.outputs.completed }}
    steps:
      - name: Check successful handoff marker
        id: marker
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.client_payload.issue || inputs.issue }}
        run: |
          test -n "$ISSUE" || { echo "Missing intake issue number" >&2; exit 1; }
          MATCH=$(gh api --paginate "repos/WrazyAI/launchloom/issues/$ISSUE/comments?per_page=100" \
            --jq '.[].body | select(contains("<!-- launchloom-generation-handoff:complete -->"))')
          if [ -n "$MATCH" ]; then
            echo "completed=true" >> "$GITHUB_OUTPUT"
            echo "This intake already completed its developer handoff."
          else
            echo "completed=false" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: [profile_policy, intake_handoff_check]
    if: ${{ needs.profile_policy.outputs.profile == 'full' && (needs.intake_handoff_check.outputs.completed != 'true' || (github.event_name == 'workflow_dispatch' && inputs.reuse_authored_candidates)) }}
    runs-on: depot-ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.LAUNCHLOOM_GITHUB_ORG_TOKEN }}
      GITHUB_ORG_TOKEN: ${{ secrets.LAUNCHLOOM_GITHUB_ORG_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SEO_QUERY_PLANNER_MODEL: ${{ vars.SEO_QUERY_PLANNER_MODEL || 'z-ai/glm-5.3-flash' }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY || secrets.JEV_API_KEY }}
      REASONING_PREFLIGHT_MODE: ${{ vars.REASONING_PREFLIGHT_MODE || 'shadow' }}
      REASONING_PREFLIGHT_MODEL: ${{ vars.REASONING_PREFLIGHT_MODEL || 'jev-1.13.0' }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      FAL_IMAGE_MODEL: ${{ vars.FAL_IMAGE_MODEL || 'fal-ai/minimax/image-01' }}
      FAL_IMAGE_MAX_IMAGES: ${{ vars.FAL_IMAGE_MAX_IMAGES || '3' }}
      FAL_IMAGE_MAX_REQUESTS: ${{ vars.FAL_IMAGE_MAX_REQUESTS || '6' }}
      MODEL_AUTHORED_EXPERIENCE_MODEL: ${{ vars.MODEL_AUTHORED_EXPERIENCE_MODEL || 'z-ai/glm-5.3-flash' }}
      # Keep truth/configuration generation separate from visual authorship.
      # New creative work uses GPT-6 Luna. Translate an old organization or
      # repository override so it cannot silently keep new intakes on 5.6.
      CREATIVE_EXPERIENCE_MODEL: ${{ vars.CREATIVE_EXPERIENCE_MODEL == 'openai/gpt-5.6-luna' && 'openai/gpt-6-luna' || vars.CREATIVE_EXPERIENCE_MODEL || 'openai/gpt-6-luna' }}
      CREATIVE_EXPERIENCE_REASONING_EFFORT: ${{ vars.CREATIVE_EXPERIENCE_REASONING_EFFORT || 'xhigh' }}
      # Authored rendering is mandatory for every new intake. The only mode
      # distinction is whether the passing candidate is previewed or promoted;
      # no repository variable can route a new site back to the legacy DOM.
      CREATIVE_EXPERIENCE_MODE: ${{ vars.CREATIVE_EXPERIENCE_MODE == 'promote' && 'promote' || 'preview' }}
      SEO_RESEARCH_MAX_TASKS: ${{ vars.SEO_RESEARCH_MAX_TASKS || '16' }}
      SEO_RESEARCH_MAX_USD: ${{ vars.SEO_RESEARCH_MAX_USD || '0.25' }}
      SEO_FALLBACK_MAX_QUERIES: ${{ vars.SEO_FALLBACK_MAX_QUERIES || '3' }}
      SEO_FALLBACK_MAX_USD: ${{ vars.SEO_FALLBACK_MAX_USD || '0.05' }}
      SEO_FALLBACK_SEARCH_MODEL: ${{ vars.SEO_FALLBACK_SEARCH_MODEL || 'openai/gpt-6-luna' }}
      REVIEW_SIGNING_SECRET: ${{ secrets.REVIEW_SIGNING_SECRET }}
      REVISION_COORDINATOR_SECRET: ${{ secrets.REVISION_COORDINATOR_SECRET }}
      LEAD_SIGNING_SECRET: ${{ secrets.LEAD_SIGNING_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LAUNCHLOOM_FROM_EMAIL: ${{ vars.LAUNCHLOOM_FROM_EMAIL }}
      LAUNCHLOOM_DEVELOPER_EMAIL: ${{ (github.event_name == 'workflow_dispatch' && inputs.internal_qa_delivery && secrets.LAUNCHLOOM_INTERNAL_QA_RECIPIENT) || (!(github.event_name == 'workflow_dispatch' && inputs.internal_qa_delivery) && vars.LAUNCHLOOM_DEVELOPER_EMAIL) || '' }}
      LAUNCHLOOM_INTERNAL_QA_RECIPIENT: ${{ secrets.LAUNCHLOOM_INTERNAL_QA_RECIPIENT }}
      QA_REPAIR_EXPERIMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.qa_repair_experiment || false }}
      INTERNAL_QA_DELIVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.internal_qa_delivery || false }}
      GENERATION_TRACKING_SECRET: ${{ secrets.GENERATION_TRACKING_SECRET }}
      FAL_IMAGE_USD_PER_IMAGE: ${{ vars.FAL_IMAGE_USD_PER_IMAGE }}
      LAUNCHLOOM_API_URL: https://api.launchloom.wrazyos.com
      REUSE_AUTHORED_CANDIDATES: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_authored_candidates || false }}
      REUSABLE_CANDIDATE_REPO: ${{ inputs.candidate_repository || '' }}
      PREVIEW_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_only || false }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install rendered acceptance browser
        run: npx playwright install --with-deps chromium
      - name: Verify required secrets
        run: |
          for key in GITHUB_ORG_TOKEN OPENROUTER_API_KEY REVIEW_SIGNING_SECRET LEAD_SIGNING_SECRET CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RESEND_API_KEY LAUNCHLOOM_FROM_EMAIL LAUNCHLOOM_DEVELOPER_EMAIL; do test -n "${!key}" || { echo "Missing: $key"; exit 1; }; done
      # Best-effort tracking. Never blocks or fails generation; disabled until
      # GENERATION_TRACKING_SECRET is configured.
      - name: Record generation started
        continue-on-error: true
        env:
          CLIENT_EMAIL: ${{ github.event.client_payload.client_email }}
          SUBMISSION_ID: ${{ github.event.client_payload.submission_id }}
        run: |
          node scripts/record-generation-event.mjs \
            --action start \
            --issue "${{ github.event.client_payload.issue || inputs.issue }}" \
            --submission-id "$SUBMISSION_ID" \
            --client-email "$CLIENT_EMAIL" \
            --status generating \
            --started-at "$(date +%s%3N)"
      - name: Read and generate from intake
        id: intake
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          ISSUE: ${{ github.event.client_payload.issue || inputs.issue }}
          LAUNCHLOOM_INTAKE_ID: ${{ github.event.client_payload.issue || inputs.issue }}
        run: |
          gh api "repos/WrazyAI/launchloom/issues/$ISSUE" --jq .body > /tmp/intake.md
          if [ "$REUSE_AUTHORED_CANDIDATES" != "true" ]; then
            node scripts/internal-qa-intake.mjs /tmp/intake.md
            node scripts/assert-client-generation-mode.mjs --intake /tmp/intake.md --profile full
          fi
          if [ "$REUSE_AUTHORED_CANDIDATES" = "true" ]; then
            case "$REUSABLE_CANDIDATE_REPO" in
              "WrazyAI/launchloom-$ISSUE-"*) ;;
              *) echo "Candidate repository must be the existing WrazyAI/launchloom-$ISSUE-* repo for this intake"; exit 1 ;;
            esac
            CANDIDATE_SOURCE="$RUNNER_TEMP/launchloom-candidate-source"
            gh repo clone "$REUSABLE_CANDIDATE_REPO" "$CANDIDATE_SOURCE" -- --branch review/initial --depth 1
            node scripts/internal-qa-intake.mjs /tmp/intake.md "$CANDIDATE_SOURCE"
            if [ "$QA_REPAIR_EXPERIMENT" = "true" ]; then
              test -f "$CANDIDATE_SOURCE/.launchloom/generated-assets.json" || { echo "Frozen QA asset manifest missing"; exit 1; }
              test -d "$CANDIDATE_SOURCE/public/images/generated" || { echo "Frozen QA asset directory missing"; exit 1; }
              mkdir -p "$RUNNER_TEMP/frozen-qa-assets/images"
              cp "$CANDIDATE_SOURCE/.launchloom/generated-assets.json" "$RUNNER_TEMP/frozen-qa-assets/manifest.json"
              cp -R "$CANDIDATE_SOURCE/public/images/generated/." "$RUNNER_TEMP/frozen-qa-assets/images/"
            fi
            for file in \
              src/site.config.json \
              .launchloom/seo-research.json \
              .launchloom/seo-map.md \
              .launchloom/business-enrichment.json \
              .launchloom/canonical-site-brief.json \
              .launchloom/inspiration-pack.json \
              .launchloom/reasoning-preflight.json \
              .launchloom/generated-experiences/creative-run.json; do
              test -f "$CANDIDATE_SOURCE/$file" || { echo "Reusable candidate repository is missing $file"; exit 1; }
            done
            cp "$CANDIDATE_SOURCE/src/site.config.json" /tmp/site.config.json
            cp "$CANDIDATE_SOURCE/.launchloom/seo-research.json" /tmp/seo-research.json
            cp "$CANDIDATE_SOURCE/.launchloom/seo-map.md" /tmp/seo-map.md
            cp "$CANDIDATE_SOURCE/.launchloom/business-enrichment.json" /tmp/business-enrichment.json
            cp "$CANDIDATE_SOURCE/.launchloom/canonical-site-brief.json" /tmp/canonical-site-brief.json
            cp "$CANDIDATE_SOURCE/.launchloom/inspiration-pack.json" /tmp/inspiration-pack.json
            cp "$CANDIDATE_SOURCE/.launchloom/reasoning-preflight.json" /tmp/reasoning-preflight.json
            mkdir -p "$RUNNER_TEMP/reusable-authored-candidates"
            cp -R "$CANDIDATE_SOURCE/.launchloom/generated-experiences/." "$RUNNER_TEMP/reusable-authored-candidates/"
            echo "Reusable private candidate artifacts loaded; fresh authoring and SEO/config model calls are skipped."
          else
            node scripts/coverage-areas.mjs --source /tmp/intake.md --out /tmp/business-enrichment.json
            node scripts/seo-research.mjs --source /tmp/intake.md --out /tmp/seo-research.json --map-out /tmp/seo-map.md --enrichment /tmp/business-enrichment.json
            node scripts/compile-canonical-site-brief.mjs --source /tmp/intake.md --research /tmp/seo-research.json --enrichment /tmp/business-enrichment.json --out /tmp/canonical-site-brief.json
            node scripts/generate-site-config.mjs --brief /tmp/canonical-site-brief.json --out /tmp/site.config.json --usage-out /tmp/site-config-usage.json
            node scripts/compile-inspiration-pack.mjs --config /tmp/site.config.json --intake /tmp/canonical-site-brief.json --out /tmp/inspiration-pack.json
            rm -f /tmp/reasoning-preflight.json
          fi
          SLUG=$(node -e 'const x=require("/tmp/site.config.json"); console.log(String(x.business?.name || "client-site").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"").slice(0,45) || "client-site")')
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "business_name=$(node -e 'const x=require("/tmp/site.config.json"); console.log(x.business.name)')" >> "$GITHUB_OUTPUT"
          echo "email=$(node -e 'const x=require("/tmp/site.config.json"); console.log(x.business.email)')" >> "$GITHUB_OUTPUT"
          echo "lead_email=$(node -e 'const x=require("/tmp/site.config.json"); console.log(x.business.leadEmail)')" >> "$GITHUB_OUTPUT"
          echo "assets=$(node -e 'const x=require("/tmp/site.config.json"); console.log(JSON.stringify(x.assets || {}))')" >> "$GITHUB_OUTPUT"
          echo "layout=$(node -e 'const x=require("/tmp/site.config.json"); console.log(x.conversion?.layout || "editorial-authority")')" >> "$GITHUB_OUTPUT"
          echo "asset_summary=$(node -e 'const x=require("/tmp/site.config.json"); console.log((x.assetReport?.used || []).map(a => a.asset + " → " + a.placement).join(", ") || "No supplied image used; approved contextual fallback or brand art selected.")')" >> "$GITHUB_OUTPUT"
          echo "research_mode=$(node -e 'const x=require("/tmp/seo-research.json"); console.log(x.mode)')" >> "$GITHUB_OUTPUT"
          echo "research_cost=$(node -e 'const x=require("/tmp/seo-research.json"); console.log(Number(x.cost?.usd || 0).toFixed(5))')" >> "$GITHUB_OUTPUT"
          echo "research_queries=$(node -e 'const x=require("/tmp/seo-research.json"); console.log((x.validatedQueries || []).map(item => item.keyword || item.query).slice(0, 6).join(", ") || "No measured queries")')" >> "$GITHUB_OUTPUT"
          node -e 'const x=require("/tmp/seo-research.json"); const web=x.fallbackSearch || {}; const observed=(x.externalSearchEvidence || []).length; const state=x.publishReady ? "Measured SEO research is complete. Production approval is available." : observed ? "Cited web observations are available for review, but measured SEO is incomplete. Production approval remains blocked." : "SEO research is incomplete. This preview can be reviewed; production approval remains blocked until measured research completes."; const fallback=web.status && web.status !== "unavailable" ? `\nFallback web search: ${web.status}; ${observed} cited observation(s) from ${web.queriesAttempted || 0} bounded query(s); provider-reported spend USD ${Number(web.costUsd || 0).toFixed(5)} / USD ${Number(web.maxUsd || 0).toFixed(2)} cap${web.costComplete === false ? " (cost reporting incomplete; further queries stopped)" : ""}.` : "\nFallback web search: unavailable."; require("node:fs").writeFileSync("/tmp/seo-research-email.txt", `${state}\nMode: ${x.mode}${fallback}\nMeasured queries: ${(x.validatedQueries || []).filter(item => item.volume !== null || item.kd !== null || item.intent !== null).map(item => item.keyword || item.query).slice(0, 6).join(", ") || "None"}\nRecorded DataForSEO cost: ${Number(x.cost?.usd || 0).toFixed(5)}`)'
      - name: Record SEO research result
        continue-on-error: true
        env:
          SUBMISSION_ID: ${{ github.event.client_payload.submission_id }}
          CLIENT_EMAIL: ${{ steps.intake.outputs.email }}
        run: |
          node scripts/generation-cost-summary.mjs \
            --seo /tmp/seo-research.json \
            --output /tmp/seo-cost.json
          node scripts/record-generation-event.mjs \
            --action event \
            --issue "${{ steps.intake.outputs.issue }}" \
            --submission-id "$SUBMISSION_ID" \
            --client-email "$CLIENT_EMAIL" \
            --business "${{ steps.intake.outputs.business_name }}" \
            --slug "${{ steps.intake.outputs.slug }}" \
            --status generating \
            --cost-summary /tmp/seo-cost.json
      - name: Reject synthetic demos from the production intake path
        run: node scripts/assert-client-generation-mode.mjs --config /tmp/site.config.json --profile full
      # Reserve visual routes against the latest main history before expensive
      # reference analysis or authoring. Branch preview-only canaries read the
      # same history without writing hypothetical attempts into production.
      # If a production intake wins the push race, reselect from latest main.
      - name: Reserve inspiration routes
        if: >-
          (github.event_name == 'repository_dispatch' || github.ref == 'refs/heads/main' ||
          (github.event_name == 'workflow_dispatch' && inputs.preview_only)) &&
          env.REUSE_AUTHORED_CANDIDATES != 'true'
        env:
          LAUNCHLOOM_INTAKE_ID: ${{ github.event.client_payload.issue || inputs.issue }}
          LAUNCHLOOM_READ_ONLY_HISTORY: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.preview_only || false }}
        run: |
          git config user.name "LaunchLoom"
          git config user.email "automation@launchloom.app"
          HISTORY_DIR="$RUNNER_TEMP/launchloom-history-main"
          HISTORY_READY=false
          for HISTORY_ATTEMPT in 1 2 3; do
            git worktree remove --force "$HISTORY_DIR" >/dev/null 2>&1 || true
            if ! git fetch origin main; then
              continue
            fi
            if ! git worktree add --detach "$HISTORY_DIR" origin/main; then
              continue
            fi
            HISTORY_FILE="$HISTORY_DIR/data/recent-launch-signatures.json"
            node "$GITHUB_WORKSPACE/scripts/compile-inspiration-pack.mjs" \
              --config /tmp/site.config.json \
              --intake /tmp/canonical-site-brief.json \
              --history "$HISTORY_FILE" \
              --out /tmp/inspiration-pack.json
            if [ "$LAUNCHLOOM_READ_ONLY_HISTORY" = "true" ]; then
              echo "Preview-only branch canary selected against latest main history; no production attempt will be written."
              HISTORY_READY=true
              break
            fi
            if ! node "$GITHUB_WORKSPACE/scripts/record-launch.mjs" \
              --config /tmp/site.config.json \
              --inspiration /tmp/inspiration-pack.json \
              --stage attempt \
              --record-key "$LAUNCHLOOM_INTAKE_ID-run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT" \
              --history "$HISTORY_FILE"; then
              git worktree remove --force "$HISTORY_DIR" >/dev/null 2>&1 || true
              continue
            fi
            if git -C "$HISTORY_DIR" diff --quiet -- data/recent-launch-signatures.json; then
              echo "No inspiration history change."
              HISTORY_READY=true
              break
            fi
            git -C "$HISTORY_DIR" add data/recent-launch-signatures.json
            git -C "$HISTORY_DIR" commit -m "Record inspiration attempt [skip ci]"
            if git -C "$HISTORY_DIR" push origin HEAD:main; then
              HISTORY_READY=true
              break
            fi
            echo "History push raced with another intake; reselecting from latest main ($HISTORY_ATTEMPT/3)."
          done
          git worktree remove --force "$HISTORY_DIR" >/dev/null 2>&1 || true
          if [ "$HISTORY_READY" != true ]; then
            echo "::error title=Inspiration reservation failed::Could not atomically reserve a fresh inspiration pack after three attempts."
            exit 1
          fi
      - name: Analyze reserved inspiration and freeze creative session
        env:
          LAUNCHLOOM_INTAKE_ID: ${{ github.event.client_payload.issue || inputs.issue }}
        run: |
          if [ "$REUSE_AUTHORED_CANDIDATES" != "true" ]; then
            node scripts/analyze-reference-dna.mjs \
              --inspiration /tmp/inspiration-pack.json \
              --out /tmp/inspiration-pack.json \
              --usage-out /tmp/reference-dna-usage.json
            rm -f /tmp/reasoning-preflight.json
            if [ "$CREATIVE_EXPERIENCE_MODEL" = "openai/gpt-6-luna" ]; then
              node scripts/run-reasoning-preflight.mjs \
                --inspiration /tmp/inspiration-pack.json \
                --out /tmp/reasoning-preflight.json \
                --mode "$REASONING_PREFLIGHT_MODE" \
                --model "$REASONING_PREFLIGHT_MODEL" \
                --creative-model "$CREATIVE_EXPERIENCE_MODEL" \
                --session-key "$LAUNCHLOOM_INTAKE_ID"
            fi
          fi
          jq -e '.referenceDnaAnalyzed == true and .referenceDossiersRequired == true and .referenceLibrary.policy == "permission-cleared-only" and .referenceLibrary.selectedDossierCount == 3 and (.routes | length == 3) and all(.routes[]; .referenceDna.analyzedFromEvidence == true and (.referenceDna.measurements != null) and (.referenceDossier.path | type == "string") and (.referenceDossier.digest | type == "string") and (.referenceDossier.designPrompt | type == "string" and length > 900) and (.referenceDna.evidence.desktopScreenshot.available == true) and (.referenceDna.evidence.mobileScreenshot.available == true) and (.referenceDna.evidence.desktopScreenshot.fullPage == true) and (.referenceDna.evidence.mobileScreenshot.fullPage == true) and (.referenceDna.rights as $rights | ["owned", "licensed", "permission-cleared"] | index($rights) != null))' /tmp/inspiration-pack.json >/dev/null || { echo "Reference DNA or permission-cleared dossier evidence is incomplete"; exit 1; }
          if [ -f /tmp/reasoning-preflight.json ]; then
            jq -e '(.creativeModel == "openai/gpt-6-luna") and (.reasoningEffort == "xhigh" or .reasoningEffort == "max") and (.recommendedEffort == "xhigh" or .recommendedEffort == "max") and (.sessionId | startswith("launchloom:creative:"))' /tmp/reasoning-preflight.json >/dev/null || { echo "Reasoning preflight did not produce a valid frozen session"; exit 1; }
            echo "reasoning_mode=$(jq -r '.mode' /tmp/reasoning-preflight.json)" >> "$GITHUB_OUTPUT"
            echo "reasoning_effort=$(jq -r '.reasoningEffort' /tmp/reasoning-preflight.json)" >> "$GITHUB_OUTPUT"
            echo "reasoning_recommended=$(jq -r '.recommendedEffort' /tmp/reasoning-preflight.json)" >> "$GITHUB_OUTPUT"
            FALLBACK_USED=$(jq -r '.selector.fallbackUsed // false' /tmp/reasoning-preflight.json)
            echo "reasoning_fallback=$FALLBACK_USED" >> "$GITHUB_OUTPUT"
            if [ "$FALLBACK_USED" = "true" ]; then
              FALLBACK_CODE=$(jq -r '.selector.error.code // "selector-error"' /tmp/reasoning-preflight.json)
              echo "::warning title=Reasoning preflight fallback::TypeSafe/Jev selector fallback is active ($FALLBACK_CODE). This creative session is frozen at max reasoning for quality safety."
            fi
          else
            echo "reasoning_mode=static" >> "$GITHUB_OUTPUT"
            echo "reasoning_effort=$CREATIVE_EXPERIENCE_REASONING_EFFORT" >> "$GITHUB_OUTPUT"
            echo "reasoning_recommended=static" >> "$GITHUB_OUTPUT"
            echo "reasoning_fallback=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create private repository and Cloudflare Pages project
        id: client
        run: |
          PROJECT="launchloom-${{ steps.intake.outputs.issue }}-${{ steps.intake.outputs.slug }}"
          # Keep preview hostnames within the length proven to receive a
          # Pages preview certificate. Branch aliases add `review-initial.`
          # before this project label, so the normal Pages project maximum is
          # too long for reliable preview TLS in this account.
          PROJECT=$(echo "$PROJECT" | tr '[:upper:]' '[:lower:]' | cut -c1-39 | sed 's/-$//')
          CLIENT_REPO="WrazyAI/$PROJECT"
          if ! gh repo view "$CLIENT_REPO" >/dev/null 2>&1; then gh repo create "$CLIENT_REPO" --private --description "Website generated by LaunchLoom" --disable-wiki; fi
          PROJECT_STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if [ "$PROJECT_STATUS" = 404 ]; then
            npx wrangler pages project create "$PROJECT" --production-branch main
          elif [ "$PROJECT_STATUS" != 200 ]; then
            echo "Cloudflare project lookup failed with HTTP $PROJECT_STATUS"
            exit 1
          fi
          # Normal intake uses a neutral, noindex placeholder to initialize
          # Pages preview certificates. Preview-only canaries must not write
          # to the production branch.
          if [ "$PREVIEW_ONLY" != "true" ]; then
          npx wrangler pages deploy "$GITHUB_WORKSPACE/templates/preview-placeholder" --project-name "$PROJECT" --commit-hash "$GITHUB_SHA" --commit-message "Prepare LaunchLoom preview certificate"
          fi
          gh label create launchloom-client-feedback --repo "$CLIENT_REPO" --color 1d76db --description "LaunchLoom client feedback inbox" --force
          INBOX=$(gh issue list --repo "$CLIENT_REPO" --state open --label launchloom-client-feedback --limit 1 --json url --jq '.[0].url // ""')
          if [ -z "$INBOX" ]; then
            INBOX=$(gh issue create --repo "$CLIENT_REPO" --title "LaunchLoom client feedback inbox" --label launchloom-client-feedback --body "Durable inbox for client-requested changes. Client feedback is reviewed internally before publishing.")
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "repo=$CLIENT_REPO" >> "$GITHUB_OUTPUT"
          echo "feedback_issue=${INBOX##*/}" >> "$GITHUB_OUTPUT"
      - name: Build private review branch
        id: branch
        run: |
          PROJECT="${{ steps.client.outputs.project }}"
          CLIENT_REPO="${{ steps.client.outputs.repo }}"
          CLIENT_DIR="$RUNNER_TEMP/$PROJECT"
          PREVIEW="https://review-initial.$PROJECT.pages.dev"
          PRODUCTION="https://$PROJECT.pages.dev"
          ORIGINS="$PREVIEW,$PRODUCTION"
          LEAD_CONFIRM_VISITOR=$(jq -r '.leadForm.confirmVisitor // false' /tmp/site.config.json 2>/dev/null || echo false)
          LEAD_BUSINESS_PHONE=$(jq -r '.business.phone // ""' /tmp/site.config.json 2>/dev/null || echo "")
          LEAD_TOKEN=$(node scripts/create-lead-token.mjs --project "$PROJECT" --recipient "${{ steps.intake.outputs.lead_email }}" --origins "$ORIGINS" --confirm-visitor "$LEAD_CONFIRM_VISITOR" --business-phone "$LEAD_BUSINESS_PHONE")
          PLACE_ID=$(node -e 'const x=require("/tmp/site.config.json"); console.log(x.business.placeId || "")')
          REVIEW_ARGS=()
          if [ -n "$PLACE_ID" ]; then
            REVIEWS_TOKEN=$(node scripts/create-google-reviews-token.mjs --project "$PROJECT" --placeId "$PLACE_ID" --origins "$ORIGINS")
            REVIEW_ARGS=(--reviewsToken "$REVIEWS_TOKEN")
          fi
          CHAT_ARGS=()
          CHAT_ENABLED=$(node -e 'const x=require("/tmp/site.config.json"); console.log(x.conversion?.aiChat?.enabled ? "true" : "false")')
          if [ "$CHAT_ENABLED" = true ]; then
            CHAT_TOKEN=$(node scripts/create-ai-chat-token.mjs --project "$PROJECT" --file /tmp/site.config.json --origins "$ORIGINS")
            CHAT_ARGS=(--chatToken "$CHAT_TOKEN")
          fi
          node scripts/enrich-site-config.mjs --file /tmp/site.config.json --assets '${{ steps.intake.outputs.assets }}' --preserve-assets "$REUSE_AUTHORED_CANDIDATES" --api "$LAUNCHLOOM_API_URL" --leadToken "$LEAD_TOKEN" "${REVIEW_ARGS[@]}" "${CHAT_ARGS[@]}"
          REMOTE="https://x-access-token:${GITHUB_ORG_TOKEN}@github.com/$CLIENT_REPO.git"
          # A newly-created private repository can be available through the
          # REST API several seconds before GitHub's Smart HTTP endpoint. Use
          # the already-authorized REST API for branch discovery so an empty
          # repository is not mistaken for a failed clone.
          REMOTE_REFS=$(gh api --paginate "repos/$CLIENT_REPO/branches?per_page=100" --jq '.[] | [.commit.sha, ("refs/heads/" + .name)] | @tsv')
          BOOTSTRAP=$(printf '%s\n' "$REMOTE_REFS" | node scripts/client-repository-bootstrap.mjs)
          if [ "$BOOTSTRAP" = review ]; then
            gh repo clone "$CLIENT_REPO" "$CLIENT_DIR" -- --branch review/initial
            cp -R templates/client-site/. "$CLIENT_DIR/"
          elif [ "$BOOTSTRAP" = main ]; then
            gh repo clone "$CLIENT_REPO" "$CLIENT_DIR" -- --branch main
            cp -R templates/client-site/. "$CLIENT_DIR/"
            cd "$CLIENT_DIR"
            git switch -c review/initial
            cd "$GITHUB_WORKSPACE"
          else
            cp -R templates/client-site "$CLIENT_DIR"
          fi
          node scripts/sync-client-guidelines.mjs "$CLIENT_DIR"
          cd "$CLIENT_DIR"
          git_push_with_retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if git push "$@"; then return 0; fi
              if [ "$attempt" -eq 5 ]; then return 1; fi
              sleep $((attempt * 2))
            done
          }
          rm -f netlify.toml
          printf '{"provider":"cloudflare-pages","project":"%s"}\n' "$PROJECT" > .launchloom-deployment.json
          if [ ! -d .git ]; then
            git init --initial-branch=main
            git config user.name "LaunchLoom"
            git config user.email "automation@launchloom.app"
            git add .
            git commit -m "Add LaunchLoom site foundation"
            git remote add origin "$REMOTE"
            git_push_with_retry origin main
            git switch -c review/initial
          else
            git config user.name "LaunchLoom"
            git config user.email "automation@launchloom.app"
            git remote set-url origin "$REMOTE"
          fi
          if [ "$QA_REPAIR_EXPERIMENT" = "true" ]; then
            node --input-type=module -e 'const { initializeQaRepairReceipt } = await import(process.env.GITHUB_WORKSPACE + "/scripts/creative-repair-experiment.mjs"); await initializeQaRepairReceipt(".launchloom/creative-repair");'
          fi
          cp /tmp/site.config.json src/site.config.json
          mkdir -p .launchloom
          cp /tmp/seo-research.json .launchloom/seo-research.json
          cp /tmp/seo-map.md .launchloom/seo-map.md
          cp /tmp/business-enrichment.json .launchloom/business-enrichment.json
          cp /tmp/canonical-site-brief.json .launchloom/canonical-site-brief.json
          cp /tmp/inspiration-pack.json .launchloom/inspiration-pack.json
          git add .
          if ! git diff --cached --quiet; then git commit -m "Create client site configuration"; fi
          if [ "$BOOTSTRAP" = "review" ]; then
            node "$GITHUB_WORKSPACE/scripts/push-client-review-branch.mjs" --branch review/initial
          else
            git_push_with_retry --set-upstream origin review/initial
          fi
          PR=$(gh pr list --repo "$CLIENT_REPO" --state open --head review/initial --json url --jq '.[0].url // ""')
          if [ -z "$PR" ]; then
            PR=$(gh pr create --repo "$CLIENT_REPO" --base main --head review/initial --title "Initial LaunchLoom site" --body "Private developer preview generated from the verified intake.\n\n<!-- launchloom-feedback-inbox:${{ steps.client.outputs.feedback_issue }} -->")
          fi
          echo "dir=$CLIENT_DIR" >> "$GITHUB_OUTPUT"
          echo "pr=${PR##*/}" >> "$GITHUB_OUTPUT"
      - name: Generate or reuse contextual imagery
        id: assets
        timeout-minutes: 12
        run: |
          cd "${{ steps.branch.outputs.dir }}"
          mkdir -p public/images/generated
          if [ "$QA_REPAIR_EXPERIMENT" = "true" ]; then
            test -f "$RUNNER_TEMP/frozen-qa-assets/manifest.json" || { echo "Frozen QA asset snapshot missing"; exit 1; }
            test -d "$RUNNER_TEMP/frozen-qa-assets/images" || { echo "Frozen QA asset snapshot directory missing"; exit 1; }
            cp "$RUNNER_TEMP/frozen-qa-assets/manifest.json" .launchloom/generated-assets.json
            cp -R "$RUNNER_TEMP/frozen-qa-assets/images/." public/images/generated/
            echo "Frozen QA contextual assets retained; provider asset generation skipped."
          else
            node "$GITHUB_WORKSPACE/scripts/generate-contextual-assets.mjs" \
              --config /tmp/site.config.json \
              --inspiration /tmp/inspiration-pack.json \
              --output "$PWD/public/images/generated" \
              --manifest "$PWD/.launchloom/generated-assets.json"
          fi
          cp /tmp/site.config.json src/site.config.json
          git add src/site.config.json public/images/generated .launchloom/generated-assets.json
          if ! git diff --cached --quiet; then
            git commit -m "Add contextual image assets"
            node "$GITHUB_WORKSPACE/scripts/push-client-review-branch.mjs" --branch review/initial
          fi
          node -e 'const x=require("/tmp/site.config.json"); const generated=(x.assetReport?.used || []).filter(a => a.source === "fal-generated"); const skipped=x.assetReport?.skipped || []; console.log(`generated=${generated.length} skipped=${skipped.length}`); require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `summary=${generated.map(a => `${a.asset} → ${a.placement}`).join(", ") || "No FAL image generated; reviewed fallback retained."}\n`)'
      - name: Author independent experience candidates
        id: authoring
        # Luna authors three independent candidates in separate stages, now
        # including the authored service, location, and services-index pages
        # per candidate. Keep the runner timeout above the author's internal
        # fail-closed budget so Actions cannot terminate a valid creative run
        # early.
        timeout-minutes: 100
        run: |
          SESSION_ARGS=()
          if [ -f /tmp/reasoning-preflight.json ]; then
            SESSION_ARGS=(--session /tmp/reasoning-preflight.json)
          fi
          if [ "$REUSE_AUTHORED_CANDIDATES" = "true" ]; then
            test -n "$REUSABLE_CANDIDATE_REPO" || { echo "Candidate repository is required when reuse is enabled"; exit 1; }
            test -f /tmp/reasoning-preflight.json || { echo "Reusable candidates require their original frozen reasoning session"; exit 1; }
            node scripts/validate-reusable-creative-candidates.mjs \
              --config /tmp/site.config.json \
              --inspiration /tmp/inspiration-pack.json \
              --candidates "$RUNNER_TEMP/reusable-authored-candidates" \
              --out /tmp/generated-experiences \
              --session /tmp/reasoning-preflight.json \
              --model "$CREATIVE_EXPERIENCE_MODEL"
          else
            npm run author:experiences -- \
              --config /tmp/site.config.json \
              --inspiration /tmp/inspiration-pack.json \
              --out /tmp/generated-experiences \
              "${SESSION_ARGS[@]}" \
              --failure-mode throw
          fi
      - name: Commit authored experience evidence
        id: authored_evidence
        run: |
          cd "${{ steps.branch.outputs.dir }}"
          mkdir -p .launchloom
          rm -rf .launchloom/generated-experiences
          cp -R /tmp/generated-experiences .launchloom/generated-experiences
          git add .launchloom/generated-experiences
          if [ -f /tmp/reasoning-preflight.json ]; then
            cp /tmp/reasoning-preflight.json .launchloom/reasoning-preflight.json
            git add .launchloom/reasoning-preflight.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record authored experience candidates"
            node "$GITHUB_WORKSPACE/scripts/push-client-review-branch.mjs" --branch review/initial
          fi
      - name: Render and repair creative candidates in the production shell
        id: creative_render
        run: |
          cd "${{ steps.branch.outputs.dir }}"
          npm ci
          SESSION_ARGS=()
          if [ -f "$PWD/.launchloom/reasoning-preflight.json" ]; then
            SESSION_ARGS=(--session "$PWD/.launchloom/reasoning-preflight.json")
          fi
          REPAIR_ARGS=(--max-cycles 3)
          if [ "$QA_REPAIR_EXPERIMENT" = "true" ]; then
            REPAIR_ARGS=(--max-cycles 1 --qa-repair-experiment true)
          fi
          node "$GITHUB_WORKSPACE/scripts/run-rendered-creative-repair.mjs" \
            --site-dir "$PWD" \
            --candidates /tmp/generated-experiences \
            --out .launchloom/creative-repair \
            --mode "$CREATIVE_EXPERIENCE_MODE" \
            "${SESSION_ARGS[@]}" \
            "${REPAIR_ARGS[@]}" \
            --visual-gate-script "$GITHUB_WORKSPACE/scripts/visual-quality-gate.mjs"
          cp .launchloom/creative-repair/final/creative-bakeoff.json .launchloom/creative-bakeoff.json
          rm -rf .launchloom/generated-experiences
          cp -R /tmp/generated-experiences .launchloom/generated-experiences
          git add .launchloom/generated-experiences .launchloom/creative-bakeoff.json src/generated-experiences/selected src/site.config.json
          if [ "$QA_REPAIR_EXPERIMENT" = "true" ]; then
            test -f .launchloom/creative-repair/qa-provider-calls.json || { echo "Private QA call receipt missing"; exit 1; }
            git add .launchloom/creative-repair/qa-provider-calls.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Render and repair creative experience candidates"
            node "$GITHUB_WORKSPACE/scripts/push-client-review-branch.mjs" --branch review/initial
          fi
      - name: Prepare private creative-recovery report
        id: creative_recovery
        if: failure() && steps.branch.outputs.dir != '' && (steps.authoring.outcome == 'failure' || steps.creative_render.outcome == 'failure' || steps.authored_evidence.outcome == 'failure')
        continue-on-error: true
        run: |
          cd "${{ steps.branch.outputs.dir }}"
          git config user.name "LaunchLoom"
          git config user.email "automation@launchloom.app"
          # Keep source, screenshots, and findings in the client's private repo.
          # They must not be uploaded as artifacts from this public repository.
          mkdir -p .launchloom/generated-experiences
          EVIDENCE_SOURCE=""
          if [ -d /tmp/generated-experiences ]; then
            EVIDENCE_SOURCE=/tmp/generated-experiences
          elif [ -d "$RUNNER_TEMP/reusable-authored-candidates" ]; then
            EVIDENCE_SOURCE="$RUNNER_TEMP/reusable-authored-candidates"
          fi
          if [ -n "$EVIDENCE_SOURCE" ]; then
            cp -R "$EVIDENCE_SOURCE/." .launchloom/generated-experiences/
          fi
          git add .launchloom/generated-experiences
          if [ -d .launchloom/creative-repair ]; then git add .launchloom/creative-repair; fi
          if ! git diff --cached --quiet; then
            git commit -m "Preserve failed creative review evidence"
          fi
          if ! node "$GITHUB_WORKSPACE/scripts/push-client-review-branch.mjs" --branch review/initial; then
            EVIDENCE_BRANCH="launchloom/evidence-${GITHUB_RUN_ID}"
            git switch -c "$EVIDENCE_BRANCH"
            if git push origin "HEAD:refs/heads/$EVIDENCE_BRANCH"; then
              echo "evidence_branch=$EVIDENCE_BRANCH" >> "$GITHUB_OUTPUT"
              echo "Preserved generated evidence on private branch $EVIDENCE_BRANCH."
            else
              echo "Could not push private recovery evidence branch $EVIDENCE_BRANCH." >&2
              exit 1
            fi
          elif [ -n "$EVIDENCE_SOURCE" ]; then
            echo "evidence_branch=review/initial" >> "$GITHUB_OUTPUT"
          fi
          RESULT=$(node "$GITHUB_WORKSPACE/scripts/prepare-creative-recovery.mjs" \
            --site-dir "$PWD" \
            --candidates .launchloom/generated-experiences \
            --repair-root .launchloom/creative-repair)
          echo "candidate=$(printf '%s' "$RESULT" | jq -r '.candidateId')" >> "$GITHUB_OUTPUT"
          echo "repair_available=$(printf '%s' "$RESULT" | jq -r '.repairAvailable')" >> "$GITHUB_OUTPUT"
          echo "diagnostic_eligible=$(printf '%s' "$RESULT" | jq -r '.diagnosticPreviewEligible')" >> "$GITHUB_OUTPUT"
          git add .launchloom/creative-recovery.json src/site.config.json src/generated-experiences/selected
          if ! git diff --cached --quiet; then
            git commit -m "Prepare private creative recovery review"
            node "$GITHUB_WORKSPACE/scripts/push-client-review-branch.mjs" --branch review/initial
          fi
      - name: Build and deploy noindex diagnostic preview
        id: diagnostic_preview
        if: always() && steps.creative_recovery.outputs.repair_available == 'true' && steps.creative_recovery.outputs.diagnostic_eligible == 'true'
        continue-on-error: true
        env:
          LAUNCHLOOM_TEST_PAGES_PROJECT: ${{ vars.LAUNCHLOOM_TEST_PAGES_PROJECT || 'launchloom-pipeline-preview' }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          cd "${{ steps.branch.outputs.dir }}"
          PUBLIC_REVIEW_MODE=true PUBLIC_CREATIVE_DIAGNOSTIC=true PUBLIC_LAUNCHLOOM_API_URL="$LAUNCHLOOM_API_URL" npm run build
          node "$GITHUB_WORKSPACE/scripts/verify-creative-diagnostic.mjs" \
            --dist dist \
            --candidate "${{ steps.creative_recovery.outputs.candidate }}" \
            --screenshots .launchloom/creative-repair/diagnostic/screenshots
          printf '/*\n  X-Robots-Tag: noindex, nofollow, noarchive\n' > dist/_headers
          printf 'User-agent: *\nAllow: /\n' > dist/robots.txt
          rm -f dist/sitemap.xml
          git add .launchloom/creative-repair/diagnostic
          if ! git diff --cached --quiet; then
            git commit -m "Record noindex diagnostic preview checks"
            node "$GITHUB_WORKSPACE/scripts/push-client-review-branch.mjs" --branch review/initial
          fi
          RUN_SUFFIX=$(printf '%s' "$GITHUB_RUN_ID" | tail -c 9)
          BRANCH="diag-${RUN_SUFFIX}-${GITHUB_RUN_ATTEMPT}"
          PREVIEW_RESULT=$(node "$GITHUB_WORKSPACE/scripts/deploy-private-diagnostic-preview.mjs" \
            --directory "$PWD/dist" \
            --project "$LAUNCHLOOM_TEST_PAGES_PROJECT" \
            --branch "$BRANCH" \
            --source-sha "$(git rev-parse HEAD)")
          PREVIEW=$(printf '%s' "$PREVIEW_RESULT" | jq -er '.url')
          echo "preview=$PREVIEW" >> "$GITHUB_OUTPUT"
      - name: Register one-time repair session and create signed review link
        id: creative_repair_link
        if: always() && steps.creative_recovery.outputs.repair_available == 'true'
        env:
          CLIENT_REPO: ${{ steps.client.outputs.repo }}
          CLIENT_PR: ${{ steps.branch.outputs.pr }}
          CLIENT_SITE: ${{ steps.client.outputs.project }}
          CLIENT_EMAIL: ${{ steps.intake.outputs.email }}
          FEEDBACK_ISSUE: ${{ steps.client.outputs.feedback_issue }}
          DIAGNOSTIC_PREVIEW_URL: ${{ steps.diagnostic_preview.outputs.preview }}
        run: |
          test -n "$REVISION_COORDINATOR_SECRET" || { echo "Missing recovery coordinator credential" >&2; exit 1; }
          CLIENT_DIR="${{ steps.branch.outputs.dir }}"
          HEAD_SHA=$(git -C "$CLIENT_DIR" rev-parse HEAD)
          CANDIDATE="${{ steps.creative_recovery.outputs.candidate }}"
          SESSION_ID=$(printf '%s' "$CLIENT_REPO:$CLIENT_PR:$HEAD_SHA:$CANDIDATE" | sha256sum | cut -c1-32)
          PREVIEW_ORIGIN="https://$CLIENT_SITE.pages.dev"
          ORIGINS="$PREVIEW_ORIGIN"
          if [ -n "$DIAGNOSTIC_PREVIEW_URL" ]; then ORIGINS="$DIAGNOSTIC_PREVIEW_URL,$ORIGINS"; fi
          TOKEN=$(node "$GITHUB_WORKSPACE/scripts/create-review-link.mjs" \
            --stage developer \
            --repo "$CLIENT_REPO" \
            --pr "$CLIENT_PR" \
            --sha "$HEAD_SHA" \
            --site "$CLIENT_SITE" \
            --email "$LAUNCHLOOM_DEVELOPER_EMAIL" \
            --client-email "$CLIENT_EMAIL" \
            --feedback-issue "$FEEDBACK_ISSUE" \
            --origins "$ORIGINS" \
            --creative-repair-session "$SESSION_ID" \
            --token-only true)
          echo "::add-mask::$TOKEN"
          REVIEW_LINK="${LAUNCHLOOM_PLATFORM_URL:-https://launchloom.wrazyos.com}/review?token=$TOKEN"
          if [ -n "$DIAGNOSTIC_PREVIEW_URL" ]; then
            echo "send_anyway_url=$DIAGNOSTIC_PREVIEW_URL?review=$TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "send_anyway_url=" >> "$GITHUB_OUTPUT"
          fi
          SESSION_JSON=$(jq --arg session "$SESSION_ID" \
            --arg repo "$CLIENT_REPO" \
            --argjson pr "$CLIENT_PR" \
            --arg site "$CLIENT_SITE" \
            --arg sha "$HEAD_SHA" \
            --arg candidate "$CANDIDATE" \
            --arg preview "$DIAGNOSTIC_PREVIEW_URL" \
            '. + {sessionId:$session,repo:$repo,pr:$pr,siteId:$site,headSha:$sha,candidateId:$candidate,repairAvailable:true,previewUrl:(if $preview == "" then null else $preview end)} | {action:"register",repo:$repo,sessionId:$session,session:.}' \
            "$CLIENT_DIR/.launchloom/creative-recovery.json")
          curl --fail-with-body --silent --show-error \
            -X POST "$LAUNCHLOOM_API_URL/api/internal/creative-repairs" \
            -H "Authorization: Bearer $REVISION_COORDINATOR_SECRET" \
            -H "Content-Type: application/json" \
            --data "$SESSION_JSON" > "$RUNNER_TEMP/creative-repair-registration.json"
          jq -e '.status == "available" and .repairAvailable == true' "$RUNNER_TEMP/creative-repair-registration.json" >/dev/null
          gh pr comment "$CLIENT_PR" --repo "$CLIENT_REPO" --body "$(printf '%s\n\n%s\n\n%s\n\n%s' '<!-- launchloom-creative-recovery -->' '## Creative preview needs another pass' 'The authored candidate did not clear all quality checks. Review the rendered findings and request the single final repair here:' "$REVIEW_LINK")"
          echo "link=$REVIEW_LINK" >> "$GITHUB_OUTPUT"
          echo "preview=$DIAGNOSTIC_PREVIEW_URL" >> "$GITHUB_OUTPUT"
      - name: Build and direct-upload public preview
        id: deploy
        run: |
          cd "${{ steps.branch.outputs.dir }}"
          npm ci
          test -f .launchloom/creative-bakeoff.json || { echo "Creative promotion report missing"; exit 1; }
          jq -e '(.design.experience.renderer == "creative-candidate") and (.design.experience.candidateId != null) and (.design.experience.selectionMode == "creative-preview" or .design.experience.selectionMode == "creative-bakeoff")' src/site.config.json >/dev/null || { echo "Authored creative renderer was not selected"; exit 1; }
          CANDIDATE_ID=$(jq -r '.design.experience.candidateId' src/site.config.json)
          jq -e --arg candidate "$CANDIDATE_ID" '.selectedCandidateId == $candidate and .fallback == false' .launchloom/creative-bakeoff.json >/dev/null || { echo "No authored creative candidate passed the preview gates"; exit 1; }
          # Service and location detail routes intentionally retain their
          # deterministic SEO renderer. The homepage itself must be the authored
          # candidate after the fresh production build below.
          git add src/site.config.json
          if ! git diff --cached --quiet; then
            git commit -m "Select reviewed experience candidate"
            node "$GITHUB_WORKSPACE/scripts/push-client-review-branch.mjs" --branch review/initial
          fi
          FINAL_BUILD_SHA=$(git rev-parse HEAD)
          PUBLIC_REVIEW_MODE=true PUBLIC_LAUNCHLOOM_API_URL="$LAUNCHLOOM_API_URL" npm run build
          grep -I -F -q 'data-creative-host="true"' dist/index.html || { echo "Creative host marker missing from fresh build"; exit 1; }
          grep -I -F -q "data-creative-candidate=\"$CANDIDATE_ID\"" dist/index.html || { echo "Fresh build does not contain selected creative candidate $CANDIDATE_ID"; exit 1; }
          if grep -I -E -q 'data-experience-pack|legacy-design-family' dist/index.html; then echo "Legacy renderer marker found in creative preview"; exit 1; fi
          PUBLIC_REVIEW_MODE=true node "$GITHUB_WORKSPACE/scripts/verify-rendered-revision.mjs" --config src/site.config.json --dist dist --screenshots "$RUNNER_TEMP/initial-screenshots"
          node "$GITHUB_WORKSPACE/scripts/seo-release-gate.mjs" --mode review --config src/site.config.json --dist dist --report "$RUNNER_TEMP/route-technical-report.json"
          CANDIDATE_ID=$(jq -r '.design.experience.candidateId' src/site.config.json)
          FINAL_REPAIR_GATE=.launchloom/creative-repair/final/visual-gate.json
          jq -e '.status != "error" and .audit.verdict == "pass" and ((.blockers // []) | length == 0) and (((.audit.findings // []) | map(select(.severity == "critical" or .severity == "major")) | length) == 0)' "$FINAL_REPAIR_GATE" >/dev/null || { echo "Rendered creative repair did not finish with a passing visual gate"; exit 1; }
          REPAIR_SCREENSHOTS=.launchloom/creative-repair/final/screenshots
          for VIEWPORT in desktop compact mobile; do
            if [ -f "$REPAIR_SCREENSHOTS/${CANDIDATE_ID}-${VIEWPORT}.png" ]; then
              cp "$REPAIR_SCREENSHOTS/${CANDIDATE_ID}-${VIEWPORT}.png" "$RUNNER_TEMP/initial-screenshots/${VIEWPORT}.png"
            fi
          done
          rm -rf .launchloom/generated-experiences
          cp -R /tmp/generated-experiences .launchloom/generated-experiences
          git add .launchloom/generated-experiences .launchloom/creative-bakeoff.json src/generated-experiences/selected src/site.config.json
          if ! git diff --cached --quiet; then
            git commit -m "Record repaired creative candidate"
            node "$GITHUB_WORKSPACE/scripts/push-client-review-branch.mjs" --branch review/initial
          fi
          git fetch --no-tags origin refs/heads/review/initial:refs/remotes/origin/review/initial
          if ! git diff --quiet "$FINAL_BUILD_SHA" origin/review/initial -- . ':(exclude).launchloom/**'; then
            echo "Review source changed during the final build; refusing to deploy stale preview output from $FINAL_BUILD_SHA." >&2
            exit 1
          fi
          # Scan rendered text assets only. Binary generated imagery can contain
          # the UTF-8 byte sequence by coincidence and is not page copy.
          if grep -R -I -F -q --include='*.html' --include='*.css' --include='*.js' --include='*.json' --include='*.svg' --include='*.txt' "—" dist; then echo "Generated page contains an em dash"; exit 1; fi
          npx wrangler pages deploy dist --project-name "${{ steps.client.outputs.project }}" --branch review-initial --commit-hash "$FINAL_BUILD_SHA" --commit-message "Initial LaunchLoom preview"
          echo "preview=https://review-initial.${{ steps.client.outputs.project }}.pages.dev" >> "$GITHUB_OUTPUT"
          echo "sha=$FINAL_BUILD_SHA" >> "$GITHUB_OUTPUT"
      # Recording previews keeps rotation useful during internal testing. A
      # failure here must not block generation, preview deployment, or handoff.
      - name: Record launch signature for rotation
        if: github.event_name == 'repository_dispatch' || github.ref == 'refs/heads/main'
        env:
          LAUNCHLOOM_INTAKE_ID: ${{ github.event.client_payload.issue || inputs.issue }}
        continue-on-error: true
        run: |
          git config user.name "LaunchLoom"
          git config user.email "automation@launchloom.app"
          node "$GITHUB_WORKSPACE/scripts/record-launch.mjs" \
            --config "${{ steps.branch.outputs.dir }}/src/site.config.json" \
            --inspiration "${{ steps.branch.outputs.dir }}/.launchloom/inspiration-pack.json" \
            --stage preview \
            --record-key "$LAUNCHLOOM_INTAKE_ID-run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          if git diff --quiet -- data/recent-launch-signatures.json; then
            echo "No launch history change."
            exit 0
          fi
          git add data/recent-launch-signatures.json
          git commit -m "Record preview launch signature [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Track pending developer delivery
        run: |
          gh label create launchloom-delivery-pending --repo "${{ steps.client.outputs.repo }}" --color e4e669 --force
          gh pr edit "${{ steps.branch.outputs.pr }}" --repo "${{ steps.client.outputs.repo }}" --add-label launchloom-delivery-pending
      - name: Wait for secure preview URL
        run: node scripts/wait-for-pages-preview.mjs --url "${{ steps.deploy.outputs.preview }}"
      - name: Record preview ready
        continue-on-error: true
        env:
          SUBMISSION_ID: ${{ github.event.client_payload.submission_id }}
          CLIENT_EMAIL: ${{ steps.intake.outputs.email }}
        run: |
          STATUS=preview_ready
          if [ "${{ steps.creative_recovery.outputs.repair_available }}" = "true" ]; then STATUS=attention; fi
          node scripts/generation-cost-summary.mjs \
            --seo /tmp/seo-research.json \
            --site-config-usage /tmp/site-config-usage.json \
            --reference-dna-usage /tmp/reference-dna-usage.json \
            --preflight /tmp/reasoning-preflight.json \
            --assets "${{ steps.branch.outputs.dir }}/.launchloom/generated-assets.json" \
            --creative-run "${{ steps.branch.outputs.dir }}/.launchloom/generated-experiences/creative-run.json" \
            --repair-dir "${{ steps.branch.outputs.dir }}/.launchloom/creative-repair" \
            --output /tmp/generation-cost.json
          node scripts/record-generation-event.mjs \
            --action complete \
            --issue "${{ steps.intake.outputs.issue }}" \
            --submission-id "$SUBMISSION_ID" \
            --client-email "$CLIENT_EMAIL" \
            --business "${{ steps.intake.outputs.business_name }}" \
            --slug "${{ steps.intake.outputs.slug }}" \
            --site "${{ steps.client.outputs.project }}" \
            --repo "${{ steps.client.outputs.repo }}" \
            --pr "${{ steps.branch.outputs.pr }}" \
            --sha "${{ steps.deploy.outputs.sha }}" \
            --preview-url "${{ steps.deploy.outputs.preview }}" \
            --status "$STATUS" \
            --cost-summary /tmp/generation-cost.json \
            --hero "$RUNNER_TEMP/initial-screenshots/desktop.png" \
            --completed-at "$(date +%s%3N)"
      - name: Create secure review link
        id: review
        run: |
          PREVIEW="${{ steps.deploy.outputs.preview }}"
          ORIGINS="$PREVIEW,https://${{ steps.client.outputs.project }}.pages.dev"
          TOKEN=$(node scripts/create-review-link.mjs --stage developer --repo "${{ steps.client.outputs.repo }}" --pr "${{ steps.branch.outputs.pr }}" --sha "${{ steps.deploy.outputs.sha }}" --site "${{ steps.client.outputs.project }}" --email "$LAUNCHLOOM_DEVELOPER_EMAIL" --client-email "${{ steps.intake.outputs.email }}" --feedback-issue "${{ steps.client.outputs.feedback_issue }}" --origins "$ORIGINS" --token-only true)
          echo "::add-mask::$TOKEN"
          echo "link=$PREVIEW?review=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Post handoff links
        env:
          CLIENT_ASSET_SUMMARY: ${{ steps.assets.outputs.summary || steps.intake.outputs.asset_summary }}
          CLIENT_PROJECT: ${{ steps.client.outputs.project }}
          CLIENT_REPO: ${{ steps.client.outputs.repo }}
          DEVELOPER_REVIEW_LINK: ${{ steps.review.outputs.link }}
          INTAKE_ISSUE: ${{ steps.intake.outputs.issue }}
          LAYOUT: ${{ steps.intake.outputs.layout }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview }}
          RESEARCH_COST: ${{ steps.intake.outputs.research_cost }}
          RESEARCH_MODE: ${{ steps.intake.outputs.research_mode }}
          RESEARCH_QUERIES: ${{ steps.intake.outputs.research_queries }}
          REVIEW_PR: ${{ steps.branch.outputs.pr }}
        run: |
          gh pr comment "$REVIEW_PR" --repo "$CLIENT_REPO" --body "$(printf '%s\n\n%s\n\nLayout: %s\nClient assets used: %s\nSEO research mode: %s\nValidated queries: %s\nRecorded research cost: $%s\n\nPreview: %s\n\nSecure developer review: %s' '<!-- launchloom-revision:developer -->' '## Initial developer preview' "$LAYOUT" "$CLIENT_ASSET_SUMMARY" "$RESEARCH_MODE" "$RESEARCH_QUERIES" "$RESEARCH_COST" "$PREVIEW_URL" "$DEVELOPER_REVIEW_LINK")"
          gh issue comment "$INTAKE_ISSUE" --repo WrazyAI/launchloom --body "$(printf '%s\n\n%s\n\nRepository: %s\nCloudflare Pages project: %s\nDeveloper preview: %s' '<!-- launchloom-developer-review-ready -->' '## Awaiting developer approval' "$CLIENT_REPO" "$CLIENT_PROJECT" "$PREVIEW_URL")"
      - name: Send developer preview email
        env:
          BUSINESS_NAME: ${{ steps.intake.outputs.business_name }}
          CLIENT_PROJECT: ${{ steps.client.outputs.project }}
          CLIENT_REPO: ${{ steps.client.outputs.repo }}
          DEPLOY_SHA: ${{ steps.deploy.outputs.sha }}
          DEVELOPER_REVIEW_LINK: ${{ steps.review.outputs.link }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview }}
          REVIEW_PR: ${{ steps.branch.outputs.pr }}
        run: |
          node scripts/send-preview-email.mjs --to "$LAUNCHLOOM_DEVELOPER_EMAIL" --name "$BUSINESS_NAME" --preview "$PREVIEW_URL" --review "$DEVELOPER_REVIEW_LINK" --kind initial --audience developer --outcome-file /tmp/seo-research-email.txt --idempotency-key "initial-$CLIENT_PROJECT-$DEPLOY_SHA"
          gh pr comment "$REVIEW_PR" --repo "$CLIENT_REPO" --body "<!-- launchloom-initial-email:$DEPLOY_SHA -->"
          gh pr edit "$REVIEW_PR" --repo "$CLIENT_REPO" --remove-label launchloom-delivery-pending
      - name: Mark intake handoff complete
        env:
          ISSUE: ${{ github.event.client_payload.issue || inputs.issue }}
        run: |
          gh issue comment "$ISSUE" --repo WrazyAI/launchloom --body "$(printf '%s\n\n%s' '<!-- launchloom-generation-handoff:complete -->' 'Initial developer preview handoff completed.')"
      - name: Notify developer when generation stops
        if: failure()
        env:
          ISSUE: ${{ github.event.client_payload.issue || inputs.issue }}
          REPAIR_LINK: ${{ steps.creative_repair_link.outputs.link }}
          DIAGNOSTIC_PREVIEW: ${{ steps.creative_repair_link.outputs.preview }}
          SEND_ANYWAY_URL: ${{ steps.creative_repair_link.outputs.send_anyway_url }}
          CLIENT_REPO: ${{ steps.client.outputs.repo }}
          EVIDENCE_BRANCH: ${{ steps.creative_recovery.outputs.evidence_branch }}
        run: |
          NAME=$(gh issue view "$ISSUE" --repo WrazyAI/launchloom --json title --jq '.title | sub("^Intake: "; "")')
          if [ -n "$REPAIR_LINK" ]; then
            printf 'The authored design missed one or more quality checks. Review the findings and request its single final repair here:\n%s\n' "$REPAIR_LINK" > "$RUNNER_TEMP/generation-failure-feedback.txt"
            if [ -n "$DIAGNOSTIC_PREVIEW" ]; then printf 'Diagnostic-only preview (not approved for publication): %s\n' "$DIAGNOSTIC_PREVIEW" >> "$RUNNER_TEMP/generation-failure-feedback.txt"; fi
            printf 'The original generation was not promoted. The final repair is one-shot and will be checked again before a new review link is issued.\n' > "$RUNNER_TEMP/generation-failure-outcome.txt"
            node scripts/send-preview-email.mjs --to "$LAUNCHLOOM_DEVELOPER_EMAIL" --name "$NAME" --preview "${DIAGNOSTIC_PREVIEW:-https://github.com/WrazyAI/launchloom/issues/$ISSUE}" --review "$REPAIR_LINK" --send-anyway-url "$SEND_ANYWAY_URL" --kind revision --audience manual-attention --feedback-file "$RUNNER_TEMP/generation-failure-feedback.txt" --outcome-file "$RUNNER_TEMP/generation-failure-outcome.txt" --idempotency-key "generation-repair-ready-$ISSUE-${{ github.run_id }}"
          else
            printf 'Intake #%s could not be completed automatically. No client site or completion email should be assumed.\n' "$ISSUE" > "$RUNNER_TEMP/generation-failure-feedback.txt"
            if [ -n "$EVIDENCE_BRANCH" ]; then printf 'Private candidate evidence was preserved on: https://github.com/%s/tree/%s\n' "$CLIENT_REPO" "$EVIDENCE_BRANCH" >> "$RUNNER_TEMP/generation-failure-feedback.txt"; fi
            printf 'Inspect GitHub Actions run %s, correct the failure, then rerun this exact intake.\n' '${{ github.run_id }}' > "$RUNNER_TEMP/generation-failure-outcome.txt"
            node scripts/send-preview-email.mjs --to "$LAUNCHLOOM_DEVELOPER_EMAIL" --name "$NAME" --preview "https://github.com/WrazyAI/launchloom/issues/$ISSUE" --review "https://github.com/WrazyAI/launchloom/actions/runs/${{ github.run_id }}" --kind generation-failed --audience manual-attention --feedback-file "$RUNNER_TEMP/generation-failure-feedback.txt" --outcome-file "$RUNNER_TEMP/generation-failure-outcome.txt" --idempotency-key "generation-failed-$ISSUE-${{ github.run_id }}"
          fi
      - name: Record generation failure
        if: failure()
        continue-on-error: true
        env:
          ISSUE: ${{ github.event.client_payload.issue || inputs.issue }}
          SUBMISSION_ID: ${{ github.event.client_payload.submission_id }}
          REPAIR_AVAILABLE: ${{ steps.creative_repair_link.outputs.link != '' }}
          CLIENT_EMAIL: ${{ steps.intake.outputs.email }}
        run: |
          STATUS=failed
          FAILURE="Generation workflow ${{ github.run_id }} stopped before a preview was ready. Inspect the Actions run and the intake issue."
          if [ "$REPAIR_AVAILABLE" = "true" ]; then
            STATUS=attention
            FAILURE="The authored candidate needs its one-shot repair. A diagnostic preview and review link were issued to the developer."
          fi
          node scripts/record-generation-event.mjs \
            --action complete \
            --issue "$ISSUE" \
            --submission-id "$SUBMISSION_ID" \
            --client-email "$CLIENT_EMAIL" \
            --status "$STATUS" \
            --failure "$FAILURE" \
            --completed-at "$(date +%s%3N)"
